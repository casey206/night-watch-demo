<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夜巡 ・ 互動 Demo</title>
<style>
:root{
  --bg:#08090B; --ink:#EDEAE3; --muted:#9A968E; --dim:#6A6660;
  --gold:#C9A227; --gold-l:#E8CE78; --gold-d:#7E661A;
  --line:rgba(201,162,39,.22); --panel:rgba(10,11,13,.82);
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;
  --sans:"PingFang TC","Noto Sans TC",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;letter-spacing:.03em}

#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

/* backdrop */
#bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;
    transition:opacity 1.4s ease;transform:scale(1.06);animation:kb 26s ease-out infinite alternate}
@keyframes kb{from{transform:scale(1.04) translate3d(0,0,0)}to{transform:scale(1.14) translate3d(-1.5%,-1%,0)}}
#bg.on{opacity:.95}
#vig{position:absolute;inset:0;pointer-events:none;transition:opacity .8s;
  background:
    radial-gradient(62% 48% at 50% 52%,rgba(3,4,6,.86) 0%,rgba(3,4,6,.6) 44%,rgba(3,4,6,.12) 74%,transparent 88%),
    linear-gradient(180deg,rgba(3,4,6,.72) 0%,rgba(3,4,6,.1) 20%,transparent 40%),
    linear-gradient(0deg,rgba(3,4,6,.78) 0%,rgba(3,4,6,.12) 22%,transparent 42%),
    radial-gradient(130% 110% at 50% 50%,transparent 42%,rgba(3,4,6,.62) 100%)}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  animation:gr .6s steps(2) infinite}
@keyframes gr{0%{transform:translate(0,0)}50%{transform:translate(-3%,2%)}100%{transform:translate(2%,-3%)}}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:18px 26px;font-size:11px;letter-spacing:.28em;color:var(--dim);z-index:40;opacity:0;transition:opacity .8s}
#hud.on{opacity:1}
#hud b{color:var(--gold-l);font-weight:400;letter-spacing:.16em}
.clues{display:flex;gap:6px;align-items:center}
.cd{width:7px;height:7px;border:1px solid var(--gold-d);transform:rotate(45deg)}
.cd.f{background:var(--gold);box-shadow:0 0 9px rgba(201,162,39,.75)}

/* stage */
.stage{position:relative;z-index:20;width:min(860px,92vw);max-height:88vh;overflow-y:auto;padding:20px 0;
  display:flex;flex-direction:column;align-items:center;text-align:center}
.stage::-webkit-scrollbar{width:0}

.spk{font-size:11px;letter-spacing:.42em;color:var(--gold);margin-bottom:22px;opacity:0;animation:fu .8s .1s forwards}
.ln{font-family:var(--serif);font-size:clamp(19px,2.7vw,27px);line-height:1.95;margin-bottom:12px;
  opacity:0;transform:translateY(9px);animation:fu .85s forwards;text-shadow:0 2px 26px rgba(0,0,0,.95)}
.ln.q{color:var(--gold-l);margin-top:16px}
@keyframes fu{to{opacity:1;transform:none}}

.tap{margin-top:26px;font-size:11px;letter-spacing:.3em;color:var(--dim);opacity:0;animation:bl 2.4s 1.1s infinite}
@keyframes bl{0%,100%{opacity:0}50%{opacity:.75}}

.opts{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:11px}
.opt{border:1px solid var(--line);background:rgba(12,13,16,.62);backdrop-filter:blur(9px);
  padding:17px 24px;font-size:15.5px;line-height:1.7;color:#DEDAD2;cursor:pointer;text-align:left;
  transition:.28s;opacity:0;transform:translateY(11px);animation:fu .6s forwards}
.opt:hover{border-color:var(--gold);background:rgba(201,162,39,.11);color:#fff;transform:translateX(5px)}
.opt .oi{color:var(--gold);font-family:var(--serif);margin-right:13px;font-size:14px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:22px;width:100%}
.chip{border:1px solid var(--line);padding:10px 18px;font-size:14px;cursor:pointer;transition:.22s;color:#CFCBC3;
  background:rgba(12,13,16,.6)}
.chip:hover{border-color:var(--gold)}
.chip.sel{background:var(--gold);color:#0A0B0D;border-color:var(--gold);font-weight:600}

/* stepper */
.step{display:flex;align-items:center;gap:26px;margin-top:26px}
.sbtn{width:46px;height:46px;border:1px solid var(--line);background:transparent;color:var(--gold);
  font-size:24px;cursor:pointer;font-family:var(--serif);transition:.22s}
.sbtn:hover{border-color:var(--gold);background:rgba(201,162,39,.12)}
.snum{font-family:var(--serif);font-size:52px;color:var(--gold-l);min-width:80px}
.figs{display:flex;gap:10px;justify-content:center;margin-top:20px;min-height:56px;align-items:flex-end}
.fig{width:17px;height:44px;background:linear-gradient(180deg,var(--gold-l),var(--gold-d));
  border-radius:9px 9px 2px 2px;opacity:0;animation:fu .5s forwards;box-shadow:0 0 16px rgba(201,162,39,.45)}

/* input */
.inp{background:transparent;border:0;border-bottom:1px solid var(--gold-d);color:var(--gold-l);
  font-family:var(--serif);font-size:34px;text-align:center;width:170px;padding:6px 0;outline:none;letter-spacing:.2em}
.inp::placeholder{color:rgba(201,162,39,.24)}
.inp.wide{width:min(520px,80vw);font-size:20px;letter-spacing:.06em}

.btn{margin-top:32px;border:1px solid var(--gold);background:transparent;color:var(--gold-l);
  padding:14px 46px;font-size:13px;letter-spacing:.4em;cursor:pointer;transition:.28s;font-family:var(--sans)}
.btn:hover{background:var(--gold);color:#0A0B0D}
.btn.ghost{border-color:var(--line);color:var(--muted);letter-spacing:.2em;padding:12px 30px;font-size:12px}
.btn.ghost:hover{background:transparent;border-color:var(--gold);color:var(--gold-l)}
.brow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* 委任狀 */
.env{width:min(430px,84vw);aspect-ratio:1.62;background:linear-gradient(160deg,#1A1C21,#0D0E11);
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;cursor:pointer;transition:.5s;position:relative;box-shadow:0 40px 90px rgba(0,0,0,.85)}
.env:hover{transform:translateY(-7px);border-color:var(--gold)}
.seal{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#C0392B,#7B1E14);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:#F3D9A0;font-size:24px;
  box-shadow:0 5px 20px rgba(0,0,0,.75),inset 0 -3px 9px rgba(0,0,0,.5)}
.warrant{width:min(560px,90vw);border:1px solid var(--line);background:linear-gradient(170deg,rgba(24,26,31,.94),rgba(10,11,14,.97));
  padding:44px 40px;text-align:center;box-shadow:0 40px 100px rgba(0,0,0,.9)}
.warrant .wt{font-family:var(--serif);font-size:15px;letter-spacing:.7em;color:var(--gold);margin-bottom:8px}
.warrant .wh{font-family:var(--serif);font-size:29px;letter-spacing:.35em;margin-bottom:30px}
.warrant .wl{font-family:var(--serif);font-size:16.5px;line-height:2.4;color:#D6D2CA}
.rules{margin-top:28px;padding-top:22px;border-top:1px solid var(--line);font-size:12.5px;
  line-height:2.2;color:var(--muted);text-align:left;letter-spacing:.08em}
.rules b{color:var(--gold);font-weight:400;margin-right:10px}

/* 交接紀錄 */
.rec{width:min(560px,90vw);border:1px solid var(--line);background:linear-gradient(170deg,rgba(24,26,31,.95),rgba(10,11,14,.97));
  padding:42px 40px;text-align:left;box-shadow:0 40px 100px rgba(0,0,0,.9)}
.rec .rt{font-family:var(--serif);font-size:12px;letter-spacing:.5em;color:var(--gold);text-align:center;margin-bottom:26px}
.rl{display:flex;padding:12px 0;border-bottom:1px solid rgba(201,162,39,.1);font-size:15px;align-items:baseline}
.rl:last-child{border:0}
.rl .a{flex:0 0 96px;font-size:11.5px;letter-spacing:.24em;color:var(--dim)}
.rl .b{flex:1;font-family:var(--serif);font-size:17px;color:var(--ink)}
.rl .b.gold{color:var(--gold-l)}

/* backstage */
.bs{width:100%;text-align:left;background:rgba(6,7,9,.94);border:1px solid var(--line);padding:34px 32px;
    box-shadow:0 40px 100px rgba(0,0,0,.9)}
.bsh{display:flex;align-items:baseline;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.bsh .t{font-family:var(--serif);font-size:26px;letter-spacing:.08em}
.bsh .s{font-size:11px;letter-spacing:.3em;color:var(--gold)}
.bsub{font-size:13.5px;color:var(--muted);margin-bottom:26px;line-height:1.8}
.tbl{border:1px solid var(--line);margin-bottom:22px;overflow:hidden}
.trow{display:flex;border-bottom:1px solid rgba(201,162,39,.1);font-size:13.5px}
.trow:last-child{border:0}
.trow.h{background:rgba(201,162,39,.09);font-size:11px;letter-spacing:.2em;color:var(--gold)}
.trow>div{padding:12px 15px;line-height:1.7}
.c1{flex:0 0 120px;color:var(--dim);border-right:1px solid rgba(201,162,39,.1)}
.c2{flex:1.15;color:#D6D2CA;border-right:1px solid rgba(201,162,39,.1)}
.c3{flex:1;color:var(--gold-l);font-weight:600}
.brief{border:1px solid var(--gold-d);background:rgba(201,162,39,.07);padding:24px 26px;font-size:15px;line-height:2}
.brief .bh{font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:14px}
.brief em{color:var(--gold-l);font-style:normal}

/* transitions */
#flash{position:fixed;inset:0;background:#000;z-index:60;opacity:0;pointer-events:none;transition:opacity .55s}
#flash.on{opacity:1;pointer-events:all}
#chime{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;flex-direction:column;background:#050608}
#chime.on{display:flex}
#chime .ct{font-family:var(--serif);font-size:clamp(60px,15vw,150px);color:var(--gold);letter-spacing:.2em;
  text-shadow:0 0 70px rgba(201,162,39,.55)}
#chime .cs{font-size:11px;letter-spacing:.55em;color:var(--dim);margin-top:22px}
.pulse{animation:pl 1s ease-out}
@keyframes pl{0%{transform:scale(1);opacity:1}60%{transform:scale(1.1);opacity:.5}100%{transform:scale(1);opacity:1}}

.note{font-size:12.5px;color:var(--dim);line-height:1.9;margin-top:20px;max-width:56ch}
@media(max-width:640px){
  .stage{width:94vw}
  #hud{padding:12px 15px;font-size:10px;letter-spacing:.18em}
  .warrant,.rec{padding:30px 22px}
  .c1{flex:0 0 82px}
  .trow{font-size:12.5px}
}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div><div id="vig"></div><div id="grain"></div>
  <div id="hud">
    <div>寶城典藏館 ・ 第 <b>087</b> 任館長</div>
    <div id="clock"></div>
    <div class="clues" id="clues"></div>
  </div>
  <div class="stage" id="stage"></div>
</div>
<div id="chime"><div class="ct" id="chimeT">十二</div><div class="cs" id="chimeS">MIDNIGHT</div></div>
<div id="flash"></div>

<script>
/* ══════════════════════════════════════════════
   夜巡 ・ 互動 Demo  —  寶城人壽 VVIP 企劃原型
   ══════════════════════════════════════════════ */

const S = { surname:'', relic:'', data:{}, clues:0, min:0, motto:'', family:0, roles:[] };

const el = id => document.getElementById(id);
const stage = el('stage'), bgEl = el('bg'), app = el('app');
/* 對白推進綁在整個畫面上，任何地方都點得到；選項/按鈕自行 stopPropagation */
function setTap(fn){ app.onclick = fn; app.style.cursor = fn ? 'pointer' : 'default'; }

function setBg(src){
  if(!src){ bgEl.classList.remove('on'); return; }
  bgEl.classList.remove('on');
  setTimeout(()=>{ bgEl.style.backgroundImage = `url('${src}')`; bgEl.classList.add('on'); }, 120);
}
function hud(on){ el('hud').classList.toggle('on', on); paintHud(); }
function paintHud(){
  const left = 360 - S.min;
  el('clock').innerHTML = left>0
    ? `天亮還有 <b>${Math.floor(left/60)}</b> 小時 <b>${String(left%60).padStart(2,'0')}</b> 分`
    : `<b>六點</b>`;
  el('clues').innerHTML = '<span style="margin-right:8px">線索</span>' +
    Array.from({length:6},(_,i)=>`<span class="cd ${i<S.clues?'f':''}"></span>`).join('');
}
function fade(fn){
  el('flash').classList.add('on');
  setTimeout(()=>{ fn(); el('flash').classList.remove('on'); }, 560);
}
function chime(word, sub, times, then){
  el('chimeT').textContent = word; el('chimeS').textContent = sub;
  el('chime').classList.add('on');
  let n=0;
  const t = setInterval(()=>{
    el('chimeT').classList.remove('pulse'); void el('chimeT').offsetWidth; el('chimeT').classList.add('pulse');
    if(++n>=times){ clearInterval(t); setTimeout(()=>{ el('chime').classList.remove('on'); then(); }, 900); }
  }, 520);
}

/* ── 對白播放器 ── */
function play(o){
  // o: {bg, spk, lines[], q, render()}
  if(o.bg!==undefined) setBg(o.bg);
  let i = 0;
  const all = o.lines || [];
  const still = 'animation:none;opacity:1;transform:none';
  function draw(){
    stage.innerHTML = (o.spk ? `<div class="spk" style="${still}">${o.spk}</div>` : '')
      + all.slice(0,i+1).map((t,k)=>`<div class="ln" style="${k<i?still:''}">${t}</div>`).join('')
      + (i < all.length-1 ? `<div class="tap">點擊繼續</div>` : '');
    stage.scrollTop = stage.scrollHeight;
  }
  function next(){
    if(i < all.length-1){ i++; draw(); }
    else { setTap(null); o.render(); }
  }
  if(all.length){ setTap(next); draw(); }
  else { setTap(null); o.render(); }
}

/* 在既有對白下方接上題目與選項 */
function ask(o){
  play({ bg:o.bg, spk:o.spk, lines:o.lines, render(){
    stage.innerHTML = (o.spk?`<div class="spk">${o.spk}</div>`:'')
      + (o.lines||[]).map(t=>`<div class="ln">${t}</div>`).join('')
      + `<div class="ln q">${o.q}</div>`
      + `<div class="opts">` + o.options.map((op,k)=>
          `<div class="opt" data-k="${k}" style="animation-delay:${.12+k*.09}s"><span class="oi">${'一二三四五'[k]}</span>${op.t}</div>`
        ).join('') + `</div>`;
    stage.querySelectorAll('.opt').forEach(n=>n.onclick = e=>{
      e.stopPropagation();
      const op = o.options[+n.dataset.k];
      if(o.key) S.data[o.key] = {q:o.label||o.q, a:op.t, field:op.field, val:op.val};
      react(o, op);
    });
  }});
}
function react(o, op){
  S.min += (o.adv||0); paintHud();
  const tail = [];
  if(op.r) tail.push(`<div class="ln">${op.r}</div>`);
  if(o.clue){ S.clues++; paintHud();
    tail.push(`<div class="ln q" style="animation-delay:.5s">「${o.clue}」</div>`);
    tail.push(`<div class="spk" style="animation-delay:.9s;margin-top:20px">線索 ${S.clues} / 6</div>`); }
  stage.innerHTML = (o.spk?`<div class="spk">${o.spk}</div>`:'') + tail.join('')
    + `<div class="tap" style="animation-delay:1.3s">點擊繼續</div>`;
  setTap(()=>{ setTap(null); fade(()=>go(o.next)); });
}

/* ══════════ 場景 ══════════ */
const SC = {};

/* 0 ─ 封緘的委任狀 */
SC.boot = ()=>{
  hud(false); setBg('');
  stage.innerHTML = `
    <div class="env" id="env">
      <div class="spk" style="margin:0">寶 城 典 藏 館</div>
      <div class="seal">寶</div>
      <div style="font-size:12px;letter-spacing:.34em;color:var(--dim)">委 任 狀 ・ 第 087 號</div>
      <div class="tap" style="margin-top:8px">點擊拆封</div>
    </div>
    <div class="note" style="text-align:center">互動 Demo ・ 完整體驗約 3 分鐘 ・ 所有選項皆可點</div>`;
  el('env').onclick = ()=> fade(()=>go('warrant'));
};

/* 1 ─ 委任狀 */
SC.warrant = ()=>{
  setBg('assets/01_door.jpg');
  stage.innerHTML = `
    <div class="warrant">
      <div class="wt">寶 城 典 藏 館</div>
      <div class="wh">館長委任狀</div>
      <div class="wl">
        茲委任 &nbsp;<input class="inp" id="sn" maxlength="2" placeholder="姓氏">&nbsp; 先生／女士<br>
        為本館第 087 任館長<br>
        任期：即日十二時起，至翌日六時止
      </div>
      <div class="rules">
        <b>一</b>館長對館藏負全責。<br>
        <b>二</b>夜間所見，不得對外言說。<br>
        <b>三</b>天亮鐘響，一切歸位。
      </div>
    </div>
    <button class="btn" id="go">就　任</button>`;
  const sn = el('sn'); sn.focus();
  el('go').onclick = ()=>{
    S.surname = (sn.value.trim() || '陳');
    fade(()=>go('relic'));
  };
  sn.onkeydown = e=>{ if(e.key==='Enter') el('go').click(); };
};

/* 2 ─ 就任第一題：留一件東西 */
SC.relic = ()=> ask({
  bg:'assets/01_door.jpg', spk:'館務程序 ・ 其一', adv:0, key:'relic',
  label:'就任時留在館中的物件',
  lines:['「按館規，新任館長就任時，', '　須留一件自己的東西在館中。」'],
  q:`「${S.surname}館長，您留什麼？」`,
  options:[
    {t:'一支筆。簽下第一張合約的那支。', field:'性格原型', val:'開創型 ・ 自建事業', r:'它被收進了展櫃。玻璃上映出你的臉。'},
    {t:'一只錶。父親留下來的。',           field:'性格原型', val:'承繼型 ・ 重家族連結', r:'它被收進了展櫃。秒針還在走。'},
    {t:'一張全家福。',                     field:'性格原型', val:'守護型 ・ 家庭為重心', r:'它被收進了展櫃。相框有點舊了。'},
    {t:'一把鑰匙。公司大門的。',           field:'性格原型', val:'掌權型 ・ 控制傾向高', r:'它被收進了展櫃。齒紋磨得很平。'}
  ],
  next:'rule3'
});

/* 3 ─ 就任第二題：館規第三條（風險偏好） */
SC.rule3 = ()=> ask({
  bg:'assets/01_door.jpg', spk:'館務程序 ・ 其二', adv:0, key:'risk',
  label:'館藏損失的處理方式（風險態度）',
  lines:['「還有一項，需要您親自決定。」','「館規第一條——館長對館藏負全責。」'],
  q:'「萬一今夜有所損失，您希望怎麼處理？」',
  options:[
    {t:'我自己賠。東西在我手上，就是我的事。', field:'風險態度', val:'自留風險 ・ 對保險抗性高', r:'「⋯⋯您跟前面幾任很像。」'},
    {t:'全館共同分攤。大家都是館裡的人。',     field:'風險態度', val:'共同分攤 ・ 對互助制度接受', r:'「這是最古老的辦法。三千年前就有人這樣做。」'},
    {t:'早該先保起來。這種事不能靠運氣。',     field:'風險態度', val:'事前移轉 ・ 對保險接受度高', r:'「⋯⋯可惜，今晚來不及了。」'}
  ],
  next:'midnight'
});

/* 4 ─ 十二點 */
SC.midnight = ()=>{
  hud(false); stage.innerHTML='';
  chime('十二','MIDNIGHT',3, ()=>{ S.min=0; hud(true); go('incident'); });
};

/* 5 ─ 事件 */
SC.incident = ()=>{
  play({ bg:'assets/02_vitrine.jpg', spk:'館内 ・ 零時',
    lines:[
      `「${S.surname}館長。」`,
      '「中央展櫃⋯⋯空了。」',
      '「<span style="color:var(--gold-l)">翠玉白菜不見了。</span>」',
      '「六點鐘響，全館歸位、石化。」',

  stage.innerHTML = `
    <div class="bs">
      <div class="bsh"><span class="s">顧 問 後 台</span><span class="t">${S.surname}　客戶檔案</span>
        <span style="font-size:12px;color:var(--dim);margin-left:auto">第 087 號 ・ 一夜完成</span></div>
      <div class="bsub">同一份體驗，客戶看到的是一個故事；顧問看到的是這一頁。<br>
        <b style="color:var(--gold-l)">客戶從頭到尾沒有填過一張表格。</b></div>

      <div class="tbl">
        <div class="trow h"><div class="c1">欄位</div><div class="c2">他在遊戲裡的回答</div><div class="c3">系統判讀</div></div>
        ${rows}
        <div class="trow"><div class="c1">人生信條</div><div class="c2">「${S.motto}」</div><div class="c3">親筆附記 ・ 破冰最強素材</div></div>
      </div>

      <div class="brief">
        <div class="bh">系 統 建 議 ・ 首 次 接 觸</div>
        推銷抗性：<em>${resist}</em><br>
        開場建議：<em>${open}</em>。<br>
        優先議題：<em>${anx}</em>；受益／受扶養對象 <em>${S.family} 人</em>。<br>
        商品方向：<em>${prod}</em>。<br>
        可用破冰句：他親手寫下「<em>${S.motto}</em>」——見面時從這句開始。
      </div>

      <div class="note" style="margin-top:26px">
        後台<b style="color:var(--gold-l)">不丟原始欄位給業務員，只丟「怎麼開口」</b>。<br>
        這一條決定顧問會不會用第二次——也是多數保險數位活動失敗的真正原因。
      </div>

      <div class="brow" style="margin-top:34px;justify-content:flex-start">
        <button class="btn" id="r">重 新 體 驗</button>
      </div>
    </div>`;
  el('r').onclick = ()=>{
    S.data={}; S.clues=0; S.min=0; S.motto=''; S.family=0; S.roles=[];
    fade(()=>go('boot'));
  };
};

function go(id){ setTap(null); stage.onclick=null; SC[id](); }
go('boot');
</script>
</body>
</html>
