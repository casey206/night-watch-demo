<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夜巡 ・ 互動 Demo</title>
<style>
:root{
  --bg:#060709;--ink:#EDEAE3;--muted:#9A968E;--dim:#6A6660;
  --gold:#C9A227;--gold-l:#E8CE78;--gold-d:#7E661A;
  --line:rgba(201,162,39,.22);
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;
  --sans:"PingFang TC","Noto Sans TC",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);letter-spacing:.03em}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:default}

/* ── 背景 ── */
#bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;
    transition:opacity 1.4s ease;animation:kb 30s ease-out infinite alternate}
@keyframes kb{from{transform:scale(1.05)}to{transform:scale(1.15) translate3d(-1.4%,-1%,0)}}
#bg.on{opacity:.95}
#vig{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(62% 48% at 50% 52%,rgba(3,4,6,.86) 0%,rgba(3,4,6,.6) 44%,rgba(3,4,6,.12) 74%,transparent 88%),
    linear-gradient(180deg,rgba(3,4,6,.72) 0%,rgba(3,4,6,.1) 20%,transparent 40%),
    linear-gradient(0deg,rgba(3,4,6,.78) 0%,rgba(3,4,6,.12) 22%,transparent 42%),
    radial-gradient(130% 110% at 50% 50%,transparent 42%,rgba(3,4,6,.62) 100%)}
#vig.lift{opacity:.35}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  animation:gr .6s steps(2) infinite}
@keyframes gr{0%{transform:translate(0,0)}50%{transform:translate(-3%,2%)}100%{transform:translate(2%,-3%)}}

/* ── 第一人稱 ── */
#pov{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s}
#pov.on{opacity:1}
#pov::before,#pov::after{content:"";position:absolute;left:0;right:0;height:8vh;background:#040507}
#pov::before{top:0}#pov::after{bottom:0}
body.pov #bg{animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{from{transform:scale(1.11) translate3d(-.6%,.3%,0)}to{transform:scale(1.14) translate3d(.6%,-.4%,0)}}

/* ── HUD ── */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:16px 24px;font-size:11px;letter-spacing:.26em;color:var(--dim);z-index:40;opacity:0;transition:opacity .8s}
#hud.on{opacity:1}
#hud b{color:var(--gold-l);font-weight:400;letter-spacing:.14em}
.clues{display:flex;gap:6px;align-items:center}
.cd{width:7px;height:7px;border:1px solid var(--gold-d);transform:rotate(45deg)}
.cd.f{background:var(--gold);box-shadow:0 0 9px rgba(201,162,39,.75)}

/* ── 舞台 ── */
.stage{position:relative;z-index:20;width:min(880px,93vw);max-height:88vh;overflow-y:auto;padding:14px 0;
  display:flex;flex-direction:column;align-items:center;text-align:center}
.stage::-webkit-scrollbar{width:0}
.spk{font-size:11px;letter-spacing:.42em;color:var(--gold);margin-bottom:18px;opacity:0;animation:fu .8s .1s forwards}
.ln{font-family:var(--serif);font-size:clamp(20px,2.9vw,29px);line-height:1.85;margin-bottom:9px;
  opacity:0;transform:translateY(9px);animation:fu .85s forwards;text-shadow:0 2px 26px rgba(0,0,0,.95)}
.ln.q{color:var(--gold-l);margin-top:12px}
@keyframes fu{to{opacity:1;transform:none}}
.tap{margin-top:22px;font-size:11px;letter-spacing:.3em;color:var(--dim);opacity:0;animation:bl 2.4s 1s infinite}
@keyframes bl{0%,100%{opacity:0}50%{opacity:.75}}

/* ── 上一個決定 ── */
.recap{width:100%;border:1px solid rgba(201,162,39,.18);background:rgba(10,11,14,.66);
  padding:12px 18px;margin-bottom:22px;text-align:left;opacity:0;animation:fu .7s forwards}
.recap .rk{font-size:10px;letter-spacing:.3em;color:var(--dim);margin-bottom:6px}
.recap .rv{font-size:14px;color:#CFCBC3;line-height:1.7}
.recap .rv b{color:var(--gold-l);font-weight:400}
.tags{display:inline-flex;gap:6px;margin-left:10px;vertical-align:middle}
.tag{font-size:10.5px;letter-spacing:.1em;color:var(--gold);border:1px solid rgba(201,162,39,.3);
  padding:2px 8px;white-space:nowrap}

/* ── 選項 ── */
.opts{width:100%;margin-top:24px;display:flex;flex-direction:column;gap:10px}
.opt{border:1px solid var(--line);background:rgba(10,11,14,.66);backdrop-filter:blur(9px);
  padding:15px 20px;font-size:16px;line-height:1.6;color:#DEDAD2;cursor:pointer;text-align:left;
  transition:.25s;opacity:0;transform:translateY(11px);animation:fu .55s forwards;
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.opt:hover{border-color:var(--gold);background:rgba(201,162,39,.11);color:#fff;transform:translateX(5px)}
.opt .oi{color:var(--gold);font-family:var(--serif);font-size:14px}
.opt .ot{flex:1;min-width:12em}
.opt .tags{margin-left:auto}

/* ── 委任狀（角色建立）── */
.warrant{width:min(640px,93vw);border:1px solid var(--line);background:linear-gradient(170deg,rgba(24,26,31,.95),rgba(10,11,14,.97));
  padding:34px 34px 30px;text-align:left;box-shadow:0 40px 100px rgba(0,0,0,.9)}
.warrant .wt{font-family:var(--serif);font-size:14px;letter-spacing:.7em;color:var(--gold);text-align:center;margin-bottom:6px}
.warrant .wh{font-family:var(--serif);font-size:26px;letter-spacing:.35em;text-align:center;margin-bottom:24px}
.fld{margin-bottom:20px}
.fld .fl{font-size:11px;letter-spacing:.3em;color:var(--dim);margin-bottom:9px}
.fld .fl em{font-style:normal;color:var(--gold);letter-spacing:.1em;margin-left:8px;font-size:10.5px}
.inp{background:transparent;border:0;border-bottom:1px solid var(--gold-d);color:var(--gold-l);
  font-family:var(--serif);font-size:24px;padding:4px 2px;outline:none;letter-spacing:.12em;width:100%}
.inp::placeholder{color:rgba(201,162,39,.22)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);padding:9px 16px;font-size:14px;cursor:pointer;transition:.2s;color:#CFCBC3;background:rgba(10,11,14,.6)}
.chip:hover{border-color:var(--gold)}
.chip.sel{background:var(--gold);color:#0A0B0D;border-color:var(--gold);font-weight:600}
.chip small{display:block;font-size:10.5px;color:inherit;opacity:.65;margin-top:2px;letter-spacing:.05em}
.chip.sel small{opacity:.8}
select.inp{appearance:none;-webkit-appearance:none;font-size:20px;cursor:pointer}
select.inp option{background:#14161A;color:var(--ink)}
.uprow{display:flex;align-items:center;gap:16px}
.upbox{width:76px;height:76px;border:1px dashed var(--gold-d);display:flex;align-items:center;justify-content:center;
  color:var(--gold-d);font-size:26px;cursor:pointer;transition:.25s;flex:0 0 auto;overflow:hidden}
.upbox:hover{border-color:var(--gold);color:var(--gold)}
.upbox img{width:100%;height:100%;object-fit:cover}
.uphint{font-size:12px;color:var(--dim);line-height:1.8}

/* ── 撥開／挖掘 ── */
.digwrap{position:relative;width:min(760px,92vw);aspect-ratio:16/10;border:1px solid var(--line);
  box-shadow:0 40px 110px rgba(0,0,0,.9);overflow:hidden;touch-action:none}
.digwrap .under{position:absolute;inset:0;background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center}
.digwrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.digwrap canvas:active{cursor:grabbing}
.dighint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;pointer-events:none;
  font-size:12px;letter-spacing:.34em;color:rgba(237,234,227,.9);text-shadow:0 1px 8px #000;
  animation:bl 2.2s .6s infinite}
.plaque{width:min(430px,84%);background:rgba(9,10,12,.92);border:1px solid var(--gold-d);padding:26px 28px;text-align:center}
.plaque .pt{font-family:var(--serif);font-size:13px;letter-spacing:.5em;color:var(--gold);margin-bottom:12px}
.plaque .ph{font-family:var(--serif);font-size:30px;letter-spacing:.3em;margin-bottom:12px}
.plaque .pd{font-size:13.5px;color:#BDB9B1;line-height:2;letter-spacing:.08em}
.plaque .pd b{color:var(--gold-l);font-weight:400}

/* ── 家庭 stepper ── */
.step{display:flex;align-items:center;gap:24px;margin-top:20px}
.sbtn{width:46px;height:46px;border:1px solid var(--line);background:transparent;color:var(--gold);
  font-size:24px;cursor:pointer;font-family:var(--serif);transition:.22s}
.sbtn:hover{border-color:var(--gold);background:rgba(201,162,39,.12)}
.snum{font-family:var(--serif);font-size:50px;color:var(--gold-l);min-width:76px}
.figs{display:flex;gap:10px;justify-content:center;margin-top:14px;min-height:50px;align-items:flex-end}
.fig{width:17px;height:42px;background:linear-gradient(180deg,var(--gold-l),var(--gold-d));
  border-radius:9px 9px 2px 2px;opacity:0;animation:fu .5s forwards;box-shadow:0 0 16px rgba(201,162,39,.45)}

/* ── 按鈕 ── */
.btn{margin-top:26px;border:1px solid var(--gold);background:transparent;color:var(--gold-l);
  padding:13px 42px;font-size:13px;letter-spacing:.4em;cursor:pointer;transition:.28s;font-family:var(--sans)}
.btn:hover{background:var(--gold);color:#0A0B0D}
.btn.ghost{border-color:var(--line);color:var(--muted);letter-spacing:.2em;padding:11px 26px;font-size:12px}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-l)}
.btn[disabled]{opacity:.35;pointer-events:none}
.brow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* ── 生成中 ── */
.render{width:min(520px,88vw);text-align:center}
.bar{height:2px;background:rgba(201,162,39,.18);margin-top:24px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 12px var(--gold);transition:width .35s}
.rlog{margin-top:18px;font-size:12.5px;letter-spacing:.16em;color:var(--dim);min-height:2.4em;line-height:1.9}

/* ── 影片 ── */
.film{width:min(940px,94vw);position:relative}
.film video{width:100%;display:block;border:1px solid var(--line);background:#000;
  box-shadow:0 40px 120px rgba(0,0,0,.9)}
.overlayName{position:absolute;left:26px;bottom:64px;text-align:left;pointer-events:none;
  text-shadow:0 2px 14px rgba(0,0,0,.9);opacity:0;transition:opacity 1.5s}
.overlayName.on{opacity:1}
.overlayName .k{font-size:10px;letter-spacing:.4em;color:var(--gold-l);margin-bottom:6px}
.overlayName .n{font-family:var(--serif);font-size:26px;letter-spacing:.2em;color:#fff}
.overlayName .m{font-family:var(--serif);font-size:14px;letter-spacing:.1em;color:rgba(237,234,227,.85);margin-top:6px}
.filmcap{margin-top:14px;font-size:12px;letter-spacing:.26em;color:var(--gold);text-align:center}
.filmsub{margin-top:8px;font-size:12px;letter-spacing:.2em;color:var(--dim);text-align:center;cursor:pointer}

/* ── 分析 ── */
.an{width:min(840px,94vw);text-align:left}
.antype{text-align:center;margin-bottom:30px}
.antype .k{font-size:11px;letter-spacing:.44em;color:var(--gold);margin-bottom:14px}
.antype .t{font-family:var(--serif);font-size:clamp(38px,6.5vw,64px);letter-spacing:.14em;line-height:1.15}
.antype .s{margin-top:12px;font-size:14px;color:var(--muted);letter-spacing:.1em}
.bars{margin:26px 0}
.brow2{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.brow2 .bl{flex:0 0 66px;font-size:12px;letter-spacing:.18em;color:var(--muted)}
.brow2 .bt{flex:1;height:7px;background:rgba(201,162,39,.13);position:relative}
.brow2 .bt i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));
  transition:width 1.1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px rgba(201,162,39,.5)}
.brow2 .bv{flex:0 0 42px;text-align:right;font-family:var(--serif);font-size:17px;color:var(--gold-l)}
.achv{border-top:1px solid rgba(201,162,39,.16);padding-top:8px;margin-top:10px}
.ach{padding:15px 0;border-bottom:1px solid rgba(201,162,39,.09)}
.ach .at{font-family:var(--serif);font-size:17px;color:var(--gold-l);letter-spacing:.06em;margin-bottom:5px}
.ach .ad{font-size:14px;color:#BDB9B1;line-height:1.85}
.voice{margin-top:22px;padding:20px 24px;border-left:2px solid var(--gold);background:rgba(201,162,39,.06)}
.voice .vq{font-family:var(--serif);font-size:17px;line-height:1.9;color:#E4E0D8}
.voice .vw{margin-top:10px;font-size:11.5px;letter-spacing:.24em;color:var(--gold)}

/* ── 紀錄 / 後台 ── */
.rec{width:min(560px,90vw);border:1px solid var(--line);background:linear-gradient(170deg,rgba(24,26,31,.95),rgba(10,11,14,.97));
  padding:36px 32px;text-align:left;box-shadow:0 40px 100px rgba(0,0,0,.9)}
.rec .rt{font-family:var(--serif);font-size:12px;letter-spacing:.5em;color:var(--gold);text-align:center;margin-bottom:20px}
.rl{display:flex;padding:11px 0;border-bottom:1px solid rgba(201,162,39,.1);font-size:15px;align-items:baseline}
.rl:last-child{border:0}
.rl .a{flex:0 0 92px;font-size:11.5px;letter-spacing:.24em;color:var(--dim)}
.rl .b{flex:1;font-family:var(--serif);font-size:17px;color:var(--ink)}
.rl .b.gold{color:var(--gold-l)}
.bs{width:100%;text-align:left;background:rgba(6,7,9,.94);border:1px solid var(--line);padding:30px 28px;
    box-shadow:0 40px 100px rgba(0,0,0,.9)}
.bsh{display:flex;align-items:baseline;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.bsh .t{font-family:var(--serif);font-size:24px;letter-spacing:.08em}
.bsh .s{font-size:11px;letter-spacing:.3em;color:var(--gold)}
.bsub{font-size:13.5px;color:var(--muted);margin-bottom:22px;line-height:1.8}
.tbl{border:1px solid var(--line);margin-bottom:20px;overflow:hidden}
.trow{display:flex;border-bottom:1px solid rgba(201,162,39,.1);font-size:13.5px}
.trow:last-child{border:0}
.trow.h{background:rgba(201,162,39,.09);font-size:11px;letter-spacing:.2em;color:var(--gold)}
.trow>div{padding:11px 14px;line-height:1.7}
.c1{flex:0 0 110px;color:var(--dim);border-right:1px solid rgba(201,162,39,.1)}
.c2{flex:1.1;color:#D6D2CA;border-right:1px solid rgba(201,162,39,.1)}
.c3{flex:1;color:var(--gold-l);font-weight:600}
.brief{border:1px solid var(--gold-d);background:rgba(201,162,39,.07);padding:20px 22px;font-size:15px;line-height:2}
.brief .bh{font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:10px}
.brief em{color:var(--gold-l);font-style:normal}

/* ── 轉場 ── */
#flash{position:fixed;inset:0;background:#000;z-index:60;opacity:0;pointer-events:none;transition:opacity .55s}
#flash.on{opacity:1;pointer-events:all}
#chime{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;flex-direction:column;background:#040507}
#chime.on{display:flex}
#chime .ct{font-family:var(--serif);font-size:clamp(60px,15vw,150px);color:var(--gold);letter-spacing:.2em;
  text-shadow:0 0 70px rgba(201,162,39,.55)}
#chime .cs{font-size:11px;letter-spacing:.55em;color:var(--dim);margin-top:20px}
.pulse{animation:pl 1s ease-out}
@keyframes pl{0%{transform:scale(1);opacity:1}60%{transform:scale(1.1);opacity:.5}100%{transform:scale(1);opacity:1}}
.note{font-size:12.5px;color:var(--dim);line-height:1.9;margin-top:16px;max-width:56ch}
.skip{position:absolute;right:22px;bottom:16px;z-index:45;font-size:11px;letter-spacing:.26em;
  color:rgba(154,150,142,.5);cursor:pointer;transition:.3s}
.skip:hover{color:var(--gold-l)}

@media(max-width:640px){
  .stage{width:94vw}
  #hud{padding:11px 13px;font-size:10px;letter-spacing:.14em}
  .warrant,.rec,.bs{padding:24px 18px}
  .c1{flex:0 0 78px}.trow{font-size:12.5px}
  .opt .tags{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div><div id="vig"></div><div id="grain"></div><div id="pov"></div>
  <div id="hud">
    <div>寶城典藏館 ・ 第 <b>087</b> 任館長</div>
    <div id="clock"></div>
    <div class="clues" id="clues"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="skip" id="skip" style="display:none">略過 →</div>
</div>
<div id="chime"><div class="ct" id="chimeT">十二</div><div class="cs" id="chimeS">MIDNIGHT</div></div>
<div id="flash"></div>

<script>
/* ═══════════════════════════════════════════════
   夜巡 v3 — 角色建立 → 選擇會被記住 → 結局由選擇組裝
   機制參考：人生模擬式敘事（回放上一個決定／flag 門控／成就式結局）
   ═══════════════════════════════════════════════ */

const S={
  name:'',sur:'',birth:1975,age:50,photo:null,
  marital:'',career:'',relic:'',risk:'',
  flags:{},           // seal / marry / kids / legacy ...
  data:{},            // 後台欄位
  ax:{事業:0,家庭:0,傳承:0},          // 影片主軸
  dim:{決斷:0,傳承:0,風險:0,情感:0,遠見:0}, // 分析長條
  last:null,          // 上一個決定 {t, tags[]}
  clues:0,min:0,family:0,roles:[],motto:''
};
const el=id=>document.getElementById(id);
const stage=el('stage'),bgEl=el('bg'),app=el('app');

function setTap(fn){app.onclick=fn;app.style.cursor=fn?'pointer':'default';}
function setBg(src){
  if(!src){bgEl.classList.remove('on');return;}
  bgEl.classList.remove('on');
  setTimeout(()=>{bgEl.style.backgroundImage=`url('${src}')`;bgEl.classList.add('on');},120);
}
function pov(on){document.body.classList.toggle('pov',on);el('pov').classList.toggle('on',on);}
function lift(on){el('vig').classList.toggle('lift',on);}
function hud(on){el('hud').classList.toggle('on',on);paint();}
function paint(){
  const left=360-S.min;
  el('clock').innerHTML=left>0
    ?`天亮還有 <b>${Math.floor(left/60)}</b> 小時 <b>${String(left%60).padStart(2,'0')}</b> 分`
    :`<b>六點</b>`;
  el('clues').innerHTML='<span style="margin-right:8px">線索</span>'+
    Array.from({length:4},(_,i)=>`<span class="cd ${i<S.clues?'f':''}"></span>`).join('');
}
function fade(fn){el('flash').classList.add('on');setTimeout(()=>{fn();el('flash').classList.remove('on');},540);}
function chime(w,s,n,then){
  el('chimeT').textContent=w;el('chimeS').textContent=s;el('chime').classList.add('on');
  let i=0;const t=setInterval(()=>{
    el('chimeT').classList.remove('pulse');void el('chimeT').offsetWidth;el('chimeT').classList.add('pulse');
    if(++i>=n){clearInterval(t);setTimeout(()=>{el('chime').classList.remove('on');then();},850);}
  },500);
}
const still='animation:none;opacity:1;transform:none';

/* ── 對白 ── */
function play(o){
  if(o.bg!==undefined)setBg(o.bg);
  let i=0;const all=o.lines||[];
  const draw=()=>{
    stage.innerHTML=(o.spk?`<div class="spk" style="${still}">${o.spk}</div>`:'')
      +all.slice(0,i+1).map((t,k)=>`<div class="ln" style="${k<i?still:''}">${t}</div>`).join('')
      +(i<all.length-1?`<div class="tap">點擊繼續</div>`:'');
    stage.scrollTop=stage.scrollHeight;
  };
  const next=()=>{i<all.length-1?(i++,draw()):(setTap(null),o.render());};
  all.length?(setTap(next),draw()):(setTap(null),o.render());
}

/* ── 提問（含上一個決定回放）── */
function ask(o){
  play({bg:o.bg,spk:o.spk,lines:o.lines,render(){
    const recap=S.last?`<div class="recap"><div class="rk">上 一 個 決 定</div>

      +(o.spk?`<div class="spk" style="${still}">${o.spk}</div>`:'')
      +(o.lines||[]).map(t=>`<div class="ln" style="${still}">${t}</div>`).join('')
      +`<div class="ln q" style="${still}">${o.q}</div>`
      +`<div class="opts">`+o.options.map((p,k)=>
        `<div class="opt" data-k="${k}" style="animation-delay:${.1+k*.08}s">
           <span class="oi">${'一二三四五'[k]}</span><span class="ot">${p.t}</span>
           <span class="tags">${(p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</span>
         </div>`).join('')+`</div>`;
    stage.querySelectorAll('.opt').forEach(n=>n.onclick=e=>{
      e.stopPropagation();
      const p=o.options[+n.dataset.k];
      if(o.key)S.data[o.key]={a:p.t,field:p.field||o.field,val:p.val};
      if(p.flag)S.flags[p.flag[0]]=p.flag[1];
      if(p.ax)for(const k in p.ax)S.ax[k]+=p.ax[k];
      if(p.dim)for(const k in p.dim)S.dim[k]+=p.dim[k];
      S.min+=(o.adv||0);paint();
      S.last={t:p.t,note:p.note||'',tags:p.tags||[]};
      if(o.clue){S.clues++;paint();}
      fade(()=>go(typeof o.next==='function'?o.next(p):o.next));
    });
  }});
}

/* ── 撥開／挖掘互動 ── */
function dig(o){
  // o:{bg?,spk,lines?,under(html or img),mode:'dust'|'ink',hint,threshold,onDone}
  setBg(o.bg||'');
  stage.innerHTML=(o.spk?`<div class="spk" style="${still}">${o.spk}</div>`:'')
    +(o.lines||[]).map(t=>`<div class="ln" style="${still}">${t}</div>`).join('')
    +`<div class="digwrap" id="dw">
        <div class="under" id="du"></div>
        <canvas id="dc"></canvas>
        <div class="dighint" id="dh">${o.hint}</div>
      </div>`;
  const du=el('du');
  if(o.underImg)du.style.backgroundImage=`url('${o.underImg}')`;
  if(o.underHtml)du.innerHTML=o.underHtml;
  const wrap=el('dw'),cv=el('dc'),ctx=cv.getContext('2d');
  const W=wrap.clientWidth,H=wrap.clientHeight;
  cv.width=W;cv.height=H;
  // 覆蓋層：灰塵 or 印泥
  if(o.mode==='dust'){
    ctx.fillStyle='#6B655B';ctx.fillRect(0,0,W,H);
    const g=ctx.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,H*.9);
    g.addColorStop(0,'rgba(90,86,78,.4)');g.addColorStop(1,'rgba(38,36,32,.95)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let i=0;i<W*H/38;i++){
      ctx.fillStyle=`rgba(${140+Math.random()*60},${132+Math.random()*55},${115+Math.random()*50},${.06+Math.random()*.3})`;
      ctx.fillRect(Math.random()*W,Math.random()*H,1.6,1.6);
    }
  }else{
    ctx.fillStyle='#7E1B12';ctx.fillRect(0,0,W,H);
    for(let i=0;i<W*H/26;i++){
      const r=Math.random();
      ctx.fillStyle=r<.5?`rgba(${120+Math.random()*40},18,12,${.15+Math.random()*.4})`
                        :`rgba(${170+Math.random()*50},${40+Math.random()*20},22,${.1+Math.random()*.35})`;
      const s=1+Math.random()*3.2;
      ctx.fillRect(Math.random()*W,Math.random()*H,s,s);
    }
    const g=ctx.createRadialGradient(W/2,H/2,H*.12,W/2,H/2,H*.95);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(40,6,4,.85)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  const R=o.mode==='ink'?34:52;
  let drawing=false,lx=0,ly=0,strokes=0,done=false;
  const pos=e=>{const r=cv.getBoundingClientRect();
    return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];};
  const carve=(x,y)=>{
    ctx.globalCompositeOperation='destination-out';
    const g=ctx.createRadialGradient(x,y,R*.25,x,y,R);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';
  };
  const ratio=()=>{
    const d=ctx.getImageData(0,0,W,H,{willReadFrequently:true}).data;
    let clear=0,n=0;
    for(let i=3;i<d.length;i+=4*97){n++;if(d[i]<40)clear++;}
    return clear/n;
  };
  const finish=()=>{
    if(done)return;done=true;
    cv.style.transition='opacity 1.1s';cv.style.opacity='0';
    el('dh').style.display='none';
    setTimeout(()=>{cv.remove();o.onDone();},1150);
  };
  cv.addEventListener('pointerdown',e=>{drawing=true;[lx,ly]=pos(e);carve(lx,ly);el('dh').style.opacity='.25';cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{
    if(!drawing||done)return;
    const[x,y]=pos(e);
    const dx=x-lx,dy=y-ly,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.floor(dist/(R*.4)));
    for(let i=1;i<=steps;i++)carve(lx+dx*i/steps,ly+dy*i/steps);
    lx=x;ly=y;
    if(++strokes%14===0&&ratio()>(o.threshold||.5))finish();
  });
  cv.addEventListener('pointerup',()=>{drawing=false;if(!done&&ratio()>(o.threshold||.5))finish();});
}

        {t:'交給守得住的人，未必是孩子。',val:'能力優先 ・ 股權信託、家族憲章',
         flag:['legacy','able'],ax:{事業:2,傳承:2},dim:{遠見:3,決斷:2},tags:['承 ＋','情 −'],note:'他抬起頭：「那你比我父親清醒。」'},
        {t:'還沒想。現在想這個太早。',val:'未啟動 ・ 最大切入空間',
         flag:['legacy','none'],ax:{事業:1},dim:{決斷:1},tags:['未 定'],note:'很長的沉默。「那你要快一點。」'}
      ]});
  }else{
    ask({...base,key:'kids_q',field:'子女意向',
      lines:['「……你看得見我？」',ref,'「有些東西，要有人接，才留得住。我到最後才懂這件事。」'],
      q:'「你想過要孩子嗎？」',
      options:[
        {t:'想。錢的事，再想辦法。',val:'有生育意願 ・ 教育金與家庭保障切入',
         flag:['kids','want'],ax:{家庭:3,傳承:1},dim:{情感:2,傳承:2},tags:['家 ＋','承 ＋'],note:'「錢的事想得完。」他說，「人不等。」'},
        {t:'不想。我的人生不缺這一塊。',val:'無生育規劃 ・ 資產以自身與公益為向',
         flag:['kids','no'],ax:{事業:2,傳承:1},dim:{決斷:2,遠見:1},tags:['自主 ＋'],note:'「至少你是自己選的。」他說，「我連這個都沒得選。」'},
        {t:'想過。一直沒敢往下算。',val:'猶豫期 ・ 以試算與規劃引導',
         flag:['kids','maybe'],ax:{家庭:2},dim:{情感:2},tags:['家 ・'],note:'「算吧。」他說，「不算的話，日子會替你決定。」'}
      ]});
  }
};

/* 6 挖印泥（找回螽斯） */
SC.inkdig=()=>{
  pov(true);
  dig({
    bg:'assets/03_qianlong.jpg',
    spk:'五 時 ・ 你 的 視 角',
    lines:['三條線索都指向同一個地方——乾隆的印泥盒。','蓋子是開的。裡面的印泥，最近被動過。'],
    mode:'ink',hint:'按 住 ， 把 印 泥 挖 開',threshold:.42,
    underImg:'assets/12_katydid_ink.jpg',
    onDone(){
      S.clues=4;paint();
      const kidsLine={
        want:'牠有兩個孩子。你剛剛說你也想要——牠大概是聽見了，才肯讓你找到。',
        no:'牠有兩個孩子。你的選擇跟牠不一樣——但守著什麼，你們是一樣的。',
        maybe:'牠有兩個孩子。你說你還在算。牠等了一夜，牠也在等一個答案。',
        undefined:'牠有兩個孩子。牠為了其中一隻，走了一整夜。'
      }[S.flags.kids];
      setTap(null);
      stage.insertAdjacentHTML('beforeend',
        `<div class="ln q" style="margin-top:22px">找到了。牠在印泥裡——裡面暖和。</div>
         <div class="ln" style="font-size:19px;color:#CFCBC3">${S.marital==='kids'?'牠有兩個孩子。跟你一樣，牠只是想把走丟的那個找回來。':kidsLine}</div>
         <button class="btn" id="n">帶 牠 回 去</button>`);
      el('n').onclick=e=>{e.stopPropagation();pov(false);fade(()=>go('family'));};
    }
  });
};

/* 7 幾隻蟲（家庭結構） */
SC.family=()=>{
  setBg('assets/08_cabbage.jpg');S.family=S.marital==='kids'?3:(S.marital==='married'?2:1);S.roles=[];
  const R=['另一半','子女','父母','孫輩','沒有血緣但算家人的'];
  const draw=()=>{
    stage.innerHTML=`
      <div class="spk" style="${still}">歸 位 之 前 ・ 最 後 一 問</div>
      <div class="ln" style="${still}">白菜身上刻著兩隻蟲——那是牠的家。</div>
      <div class="ln q" style="${still}">「${S.sur}館長，您身上刻著幾隻？」</div>
      <div class="step"><button class="sbtn" id="m">−</button><div class="snum">${S.family}</div><button class="sbtn" id="p">＋</button></div>
      <div class="figs">${Array.from({length:S.family},(_,i)=>`<div class="fig" style="animation-delay:${i*.06}s;height:${30+((i*13)%22)}px"></div>`).join('')}</div>
      <div class="chips" style="justify-content:center">${R.map(r=>`<div class="chip ${S.roles.includes(r)?'sel':''}" data-r="${r}">${r}</div>`).join('')}</div>
      <button class="btn" id="ok">確 認</button>`;
    el('m').onclick=()=>{S.family=Math.max(0,S.family-1);draw();};
    el('p').onclick=()=>{S.family=Math.min(8,S.family+1);draw();};
    stage.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
      const r=c.dataset.r;S.roles.includes(r)?S.roles.splice(S.roles.indexOf(r),1):S.roles.push(r);draw();});
    el('ok').onclick=()=>{
      S.data.family={field:'家庭結構',a:`${S.family} 人 ・ ${S.roles.join('、')||'未指定'}`,val:`受扶養／受益對象 ${S.family} 人`};
      S.dim.情感+=Math.min(S.family,3);S.ax.家庭+=Math.min(S.family,2);
      S.min=300;paint();fade(()=>go('motto'));};
  };draw();
};

/* 8 落款 */
SC.motto=()=>{
  setBg('assets/08_cabbage.jpg');
  const M=['我沒有辜負交到我手上的東西。','我做的每個決定，都想過下一代。','我來過。我盡力了。','這裡的東西，一件都沒少。'];
  stage.innerHTML=`
    <div class="spk" style="${still}">交 接 紀 錄 ・ 附 記</div>
    <div class="ln q" style="${still}">「三百年後有人翻到這一頁。要寫哪一句？」</div>
    <div class="opts">${M.map((m,k)=>`<div class="opt" data-m="${m}" style="animation-delay:${.08+k*.07}s"><span class="oi">${'一二三四'[k]}</span><span class="ot">${m}</span></div>`).join('')}
      <div class="opt" id="own" style="animation-delay:.4s"><span class="oi">五</span><span class="ot">⋯⋯我自己寫。</span></div></div>`;
  stage.querySelectorAll('.opt[data-m]').forEach(n=>n.onclick=()=>{S.motto=n.dataset.m;fade(()=>go('dawn'));});
  el('own').onclick=()=>{
    stage.innerHTML=`<div class="spk" style="${still}">附 記</div><div class="ln q" style="${still}">寫下你的那一句。</div>
      <input class="inp" id="mi" maxlength="30" placeholder="⋯⋯" style="width:min(520px,80vw);font-size:20px;text-align:center"><button class="btn" id="d">封 存</button>`;
    el('mi').focus();
    el('d').onclick=()=>{S.motto=el('mi').value.trim()||'⋯⋯';fade(()=>go('dawn'));};
    el('mi').onkeydown=e=>{if(e.key==='Enter')el('d').click();};};
};

/* 9 天亮 → 封存 → 影片（依選擇） */
SC.dawn=()=>{hud(false);stage.innerHTML='';chime('六','DAWN',3,()=>go('render'));};
function pickEnd(){
  const m=Math.max(S.ax.家庭,S.ax.傳承,S.ax.事業);
  if(m===S.ax.家庭)return{src:'assets/end_family.mp4',cap:'牠回家了。你也該回了。',key:'家庭'};
  if(m===S.ax.傳承)return{src:'assets/end_legacy.mp4',cap:'第 087 筆，落款完成。',key:'傳承'};
  return{src:'assets/end_glory.mp4',cap:'任內館藏無失。',key:'事業'};
}
SC.render=()=>{
  setBg('assets/08_cabbage.jpg');
  stage.innerHTML=`
    <div class="render">
      <div class="spk" style="${still}">交 接 影 像 ・ 封 存 中</div>
      <div class="bar"><i id="pb"></i></div>
      <div class="rlog" id="rl">讀取六小時的裁決紀錄⋯⋯</div>
    </div>`;
  const e=pickEnd();
  const L=['讀取六小時的裁決紀錄⋯⋯',
           `比對第 001–086 任館長檔案⋯⋯你的主軸：${e.key}`,
           S.photo?'將您的形象繪入交接影像⋯⋯':'以館長形象繪製交接影像⋯⋯',
           '封存完成。'];
  let i=0;
  const t=setInterval(()=>{
    i++;el('pb').style.width=Math.min(i*26,100)+'%';
    el('rl').textContent=L[Math.min(i,L.length-1)];
    if(i>=4){clearInterval(t);setTimeout(()=>fade(()=>go('film')),700);}
  },850);
};
SC.film=()=>{
  setBg('');
  const e=pickEnd();
  stage.innerHTML=`
    <div class="film">
      <video id="v" playsinline autoplay muted poster="assets/08_cabbage.jpg">
        <source src="${e.src}" type="video/mp4">
      </video>
      <div class="overlayName" id="ov">
        <div class="k">寶 城 典 藏 館 ・ 交 接 影 像</div>
        <div class="n">第 087 任館長 ・ ${S.name}</div>
        <div class="m">「${S.motto}」</div>
      </div>
      <div class="filmcap">${e.cap}</div>
      <div class="filmsub" id="sound">點 此 開 啟 聲 音</div>
    </div>
    <div class="brow" id="nx" style="opacity:0;transition:opacity 1.2s;pointer-events:none">
      <button class="btn" id="n">查 看 裁 決 分 析</button></div>
    <div class="note" style="text-align:center">這支影像由你今晚的選擇決定——主軸不同的人，看到的是另一支。<br>正式版將以您上傳的照片生成專屬影像。</div>`;
  const v=el('v');v.play().catch(()=>{});
  el('sound').onclick=ev=>{ev.stopPropagation();v.muted=!v.muted;el('sound').textContent=v.muted?'點 此 開 啟 聲 音':'聲 音 已 開 啟';};
  setTimeout(()=>el('ov').classList.add('on'),2200);
  setTimeout(()=>{const b=el('nx');b.style.opacity='1';b.style.pointerEvents='auto';},8000);
  el('n').onclick=()=>fade(()=>go('analysis'));
};

/* 10 裁決分析（成就式） */
function achievements(){
  const A=[];const f=S.flags;
  if(f.seal==='stamp'&&(f.legacy==='blood'||f.legacy==='able'))A.push(['說到做到','你要留名，也真的在安排。八十六任裡，說了又做的不到二十位。']);
  if(f.seal==='clean')A.push(['不留痕跡','你連皇帝的章都擋了。守一樣東西守到自己都不碰，這種人不多。']);
  if(f.marry==='solo')A.push(['一個人也很好','你不是沒想過。你是想清楚了。']);
  if(f.marry==='want')A.push(['想有人並肩','兩千年的兵替你高興了一下。他們很少替活人高興。']);
  if(f.kids==='want')A.push(['你算過那筆錢','算完之後，你還是說要。']);
  if(f.kids==='no')A.push(['自己選的路','溥儀說得對——至少你是自己選的。']);
  if(f.kids==='maybe')A.push(['還在算','日子不會等試算表。牠等了一夜，你打算等幾年？']);
  if(f.prio==='home')A.push(['你回了家','館裡少你一晚不會怎樣。家裡少你一晚，有人記一輩子。']);
  if(f.prio==='work')A.push(['你留了下來','館史會記得這一晚。家裡那本帳，記在另一個地方。']);
  if(f.legacy==='none')A.push(['還沒開始安排','八十六任裡有六十三位跟你一樣。差別是，他們大多在三年內動了手。']);
  if(S.risk==='self')A.push(['「我自己賠」','第 4、17、52、81 任都說過同一句。其中兩位，真的賠了。']);
  if(S.risk==='insure')A.push(['早該保起來','你是今晚唯一一個，在出事之前就想到這件事的人。']);
  if(S.photo)A.push(['留下了樣子','三百年後的人翻開紀錄，會知道第 087 任長什麼樣子。']);
  return A.slice(0,4);
}
function voice(){
  const e=pickEnd().key;
  if(e==='家庭')return['他隔著玻璃看了我很久。那個眼神我認得——家裡有人在等的人，才有那種眼神。','翠玉白菜'];
  if(e==='傳承')return['他問的那些問題，當年沒有人問過我。如果有人問過，也許東西就不會散了。','溥儀'];
  return['朕見過很多想贏的人。他是少數贏了之後，還記得回頭看一眼的。','乾隆'];
}
SC.analysis=()=>{
  setBg('assets/08_cabbage.jpg');
  const D=['決斷','傳承','風險','情感','遠見'];
  const max=Math.max(...D.map(k=>S.dim[k]),1);
  const pct={};D.forEach(k=>pct[k]=Math.round(30+70*(S.dim[k]/max)));
  const top=D.slice().sort((a,b)=>S.dim[b]-S.dim[a])[0];
  const TY={決斷:['獨行的館長','你自己扛。這座館交給你，最快。'],
            傳承:['留名的館長','你在意的不是現在，是三百年後。'],
            風險:['扛下來的館長','風險？那是我的事。'],
            情感:['守著人的館長','你護的不是館藏，是館藏後面的人。'],
            遠見:['布局的館長','你早就想過今晚會發生什麼。']}[top];
  const [vq,vw]=voice();
  stage.innerHTML=`
    <div class="an">
      <div class="antype">
        <div class="k">第 087 任館長 ・ 裁決分析</div>
        <div class="t">${TY[0]}</div>
        <div class="s">${TY[1]}</div>
      </div>
      <div class="bars">
        ${D.map(k=>`<div class="brow2"><div class="bl">${k}</div><div class="bt"><i data-w="${pct[k]}"></i></div><div class="bv">${pct[k]}</div></div>`).join('')}
      </div>
      <div class="achv">
        ${achievements().map(([t,d])=>`<div class="ach"><div class="at">${t}</div><div class="ad">${d}</div></div>`).join('')}
      </div>
      <div class="voice"><div class="vq">「${vq}」</div><div class="vw">── ${vw}</div></div>
      <div class="brow" style="margin-top:28px;justify-content:flex-start">
        <button class="btn" id="n">交 接 紀 錄</button>
        <button class="btn ghost" id="b">顧問後台檢視 →</button>
      </div>
    </div>`;
  setTimeout(()=>stage.querySelectorAll('.bt i').forEach(n=>n.style.width=n.dataset.w+'%'),120);
  el('n').onclick=()=>fade(()=>go('record'));
  el('b').onclick=()=>fade(()=>go('backstage'));
};

/* 11 交接紀錄＋交付 */
SC.record=()=>{
  setBg('assets/08_cabbage.jpg');
  stage.innerHTML=`
    <div class="rec">
      <div class="rt">寶 城 典 藏 館 ・ 交 接 紀 錄</div>
      <div class="rl"><div class="a">任 期</div><div class="b">二〇二六年 ・ 一夜</div></div>
      <div class="rl"><div class="a">館 長</div><div class="b gold">第 087 任 ・ ${S.name}</div></div>
      <div class="rl"><div class="a">館 藏</div><div class="b gold">任內無失 ・ 螽斯歸位</div></div>
      <div class="rl"><div class="a">留 存</div><div class="b">${S.data.relic.a}</div></div>
      <div class="rl"><div class="a">附 記</div><div class="b gold">「${S.motto}」</div></div>
    </div>
    <div class="ln q" style="font-size:19px;margin-top:26px">「紀錄冊需謄抄七日。留下地址，親自送到您手上。」</div>
    <div class="brow" style="margin-top:18px">
      <button class="btn" id="f">留 下 聯 絡 方 式</button>
      <button class="btn ghost" id="s">跳過，看後台</button></div>`;
  el('f').onclick=()=>{
    stage.innerHTML=`<div class="spk" style="${still}">實 體 交 付</div>
      <div class="ln q" style="font-size:20px;${still}">紀錄冊將由專屬顧問親送。</div>
      <input class="inp" placeholder="行動電話" style="width:min(520px,80vw);margin-top:22px;font-size:20px;text-align:center">
      <input class="inp" placeholder="送達地址" style="width:min(520px,80vw);margin-top:18px;font-size:20px;text-align:center">
      <button class="btn" id="d">送 出</button>
      <div class="note" style="text-align:center">Demo 不會送出任何資料。</div>`;
    el('d').onclick=()=>fade(()=>go('backstage'));};
  el('s').onclick=()=>fade(()=>go('backstage'));
};

/* 12 顧問後台 */
SC.backstage=()=>{
  setBg('');hud(false);
  const rows=Object.values(S.data).map(d=>
    `<div class="trow"><div class="c1">${d.field}</div><div class="c2">${d.a}</div><div class="c3">${d.val}</div></div>`).join('');
  const f=S.flags;
  const anx=f.legacy==='none'?'傳承尚未啟動——最大切入空間'
    :f.kids==='maybe'?'生育猶豫期——以教育金試算切入'
    :f.legacy==='blood'?'子女承接已定——保額與信託架構檢視'
    :f.marry==='want'?'成家意願明確——未來家庭保障規劃'
    :'以其當前人生階段切入';
  const open=f.prio==='home'?'從家人切入——他選過「回家」，這是他的答案'
    :f.prio==='work'?'先談事業與資產效率，家庭議題後置'
    :f.marry==='solo'?'尊重單身選擇，以自身退休與醫療為核心，勿推家庭商品'
    :'從他今晚的選擇談起，不要從商品談起';
  const resist=S.risk==='self'?'高——第一次見面完全不要提商品'
    :S.risk==='share'?'中——可從互助概念自然帶入':'低——可較早進入規劃討論';
  stage.innerHTML=`
    <div class="bs">
      <div class="bsh"><span class="s">顧 問 後 台</span><span class="t">${S.name}　客戶檔案</span>
        <span style="font-size:12px;color:var(--dim);margin-left:auto">第 087 號 ・ ${S.age} 歲 ・ 一夜完成</span></div>
      <div class="bsub">同一份體驗，客戶看到的是故事、影像與裁決分析；顧問看到的是這一頁。<br>
        <b style="color:var(--gold-l)">客戶從頭到尾沒有填過一張表格。</b></div>
      <div class="tbl">
        <div class="trow h"><div class="c1">欄位</div><div class="c2">他在遊戲裡的回答</div><div class="c3">系統判讀</div></div>
        ${rows}
        <div class="trow"><div class="c1">人生信條</div><div class="c2">「${S.motto}」</div><div class="c3">親筆附記 ・ 破冰最強素材</div></div>
        <div class="trow"><div class="c1">影像</div><div class="c2">${S.photo?'已上傳本人照片':'未上傳'}</div><div class="c3">${S.photo?'可生成專屬交接影像':'以預設形象產出'}</div></div>
      </div>
      <div class="brief">
        <div class="bh">系 統 建 議 ・ 首 次 接 觸</div>
        推銷抗性：<em>${resist}</em><br>
        開場建議：<em>${open}</em>。<br>
        優先議題：<em>${anx}</em>；受益／受扶養對象 <em>${S.family} 人</em>。<br>
        可用破冰句：他親手寫下「<em>${S.motto}</em>」——見面時從這句開始。
      </div>
      <div class="note" style="margin-top:22px">
        後台<b style="color:var(--gold-l)">不丟原始欄位給業務員，只丟「怎麼開口」</b>。<br>
        這一條決定顧問會不會用第二次。</div>
      <div class="brow" style="margin-top:28px;justify-content:flex-start">
        <button class="btn" id="r">重 新 體 驗</button></div>
    </div>`;
  el('r').onclick=()=>{location.reload();};
};

function go(id){setTap(null);stage.onclick=null;SC[id]();}
go('prologue');
</script>
