<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夜巡 ・ 互動 Demo</title>
<style>
:root{
  --bg:#060709;--ink:#EDEAE3;--muted:#9A968E;--dim:#6A6660;
  --gold:#C9A227;--gold-l:#E8CE78;--gold-d:#7E661A;
  --red:#B8443C;--jade:#7FB08A;
  --line:rgba(201,162,39,.22);
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;
  --sans:"PingFang TC","Noto Sans TC",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);letter-spacing:.03em}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:default}

#bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;
    transition:opacity 1.4s ease;animation:kb 30s ease-out infinite alternate}
@keyframes kb{from{transform:scale(1.05)}to{transform:scale(1.15) translate3d(-1.4%,-1%,0)}}
#bg.on{opacity:.95}
#vig{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(62% 48% at 50% 52%,rgba(3,4,6,.86) 0%,rgba(3,4,6,.6) 44%,rgba(3,4,6,.12) 74%,transparent 88%),
    linear-gradient(180deg,rgba(3,4,6,.72) 0%,rgba(3,4,6,.1) 20%,transparent 40%),
    linear-gradient(0deg,rgba(3,4,6,.78) 0%,rgba(3,4,6,.12) 22%,transparent 42%),
    radial-gradient(130% 110% at 50% 50%,transparent 42%,rgba(3,4,6,.62) 100%)}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  animation:gr .6s steps(2) infinite}
@keyframes gr{0%{transform:translate(0,0)}50%{transform:translate(-3%,2%)}100%{transform:translate(2%,-3%)}}
#pov{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s}
#pov.on{opacity:1}
#pov::before,#pov::after{content:"";position:absolute;left:0;right:0;height:8vh;background:#040507}
#pov::before{top:0}#pov::after{bottom:0}
body.pov #bg{animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{from{transform:scale(1.11) translate3d(-.6%,.3%,0)}to{transform:scale(1.14) translate3d(.6%,-.4%,0)}}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:14px 22px;font-size:11px;letter-spacing:.24em;color:var(--dim);z-index:40;opacity:0;transition:opacity .8s;gap:12px}
#hud.on{opacity:1}
#hud b{color:var(--gold-l);font-weight:400;letter-spacing:.12em}
#hud .low b{color:var(--red)}
.marks{display:flex;gap:6px;align-items:center}
.mk{width:9px;height:9px;border:1px solid var(--gold-d);transform:rotate(45deg);transition:.4s}
.mk.f{background:var(--gold);box-shadow:0 0 10px rgba(201,162,39,.8)}

.stage{position:relative;z-index:20;width:min(880px,93vw);max-height:88vh;overflow-y:auto;padding:14px 0;
  display:flex;flex-direction:column;align-items:center;text-align:center}
.stage::-webkit-scrollbar{width:0}
.spk{font-size:11px;letter-spacing:.42em;color:var(--gold);margin-bottom:16px;opacity:0;animation:fu .8s .1s forwards}
.era{font-size:11px;letter-spacing:.3em;color:var(--jade);margin-bottom:10px}
.ln{font-family:var(--serif);font-size:clamp(19px,2.7vw,27px);line-height:1.85;margin-bottom:9px;
  opacity:0;transform:translateY(9px);animation:fu .85s forwards;text-shadow:0 2px 26px rgba(0,0,0,.95)}
.ln.q{color:var(--gold-l);margin-top:12px}
@keyframes fu{to{opacity:1;transform:none}}
.tap{margin-top:20px;font-size:11px;letter-spacing:.3em;color:var(--dim);opacity:0;animation:bl 2.4s 1s infinite}
@keyframes bl{0%,100%{opacity:0}50%{opacity:.75}}

.recap{width:100%;border:1px solid rgba(201,162,39,.18);background:rgba(10,11,14,.66);
  padding:11px 16px;margin-bottom:18px;text-align:left;opacity:0;animation:fu .7s forwards}
.recap .rk{font-size:10px;letter-spacing:.3em;color:var(--dim);margin-bottom:5px}
.recap .rv{font-size:13.5px;color:#CFCBC3;line-height:1.7}
.recap .rv b{color:var(--gold-l);font-weight:400}
.tags{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.tag{font-size:10.5px;letter-spacing:.1em;color:var(--gold);border:1px solid rgba(201,162,39,.3);padding:2px 8px;white-space:nowrap}
.tag.chk{border-color:rgba(184,68,60,.55);color:#D9756C}
.tag.chg{border-color:rgba(127,176,138,.6);color:var(--jade)}

.opts{width:100%;margin-top:22px;display:flex;flex-direction:column;gap:9px}
.opt{border:1px solid var(--line);background:rgba(10,11,14,.68);backdrop-filter:blur(9px);
  padding:14px 18px;font-size:15.5px;line-height:1.6;color:#DEDAD2;cursor:pointer;text-align:left;
  transition:.25s;opacity:0;transform:translateY(11px);animation:fu .55s forwards;
  display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.opt:hover{border-color:var(--gold);background:rgba(201,162,39,.11);color:#fff;transform:translateX(5px)}
.opt .oi{color:var(--gold);font-family:var(--serif);font-size:14px}
.opt .ot{flex:1;min-width:11em}
.opt .tags{margin-left:auto}

/* ══ 棋盤 ══ */
.boardwrap{width:min(560px,92vw);display:flex;flex-direction:column;align-items:center}
.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
  gap:5px;padding:5px;border:1px solid var(--line);background:rgba(8,9,11,.82);
  box-shadow:0 30px 90px rgba(0,0,0,.85)}
.tile{position:relative;border:1px solid rgba(201,162,39,.16);background:rgba(16,18,22,.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:9.5px;letter-spacing:.04em;color:var(--muted);transition:.35s;overflow:hidden;padding:2px}
.tile .ic{font-family:var(--serif);font-size:17px;color:var(--gold-d);line-height:1;transition:.35s}
.tile .nm{font-size:9px;color:#8E8A83;text-align:center;line-height:1.25}
.tile.done{opacity:.4}
.tile.done .ic{color:var(--jade)}
.tile.t-history{border-color:rgba(127,176,138,.35)}
.tile.t-history .ic{color:var(--jade)}
.tile.t-crisis{border-color:rgba(184,68,60,.4)}
.tile.t-crisis .ic{color:#C4655C}
.tile.t-start{border-color:rgba(201,162,39,.5)}
.tile.here{border-color:var(--gold);background:rgba(201,162,39,.16);box-shadow:0 0 22px rgba(201,162,39,.35) inset,0 0 18px rgba(201,162,39,.25)}
.tile.here .ic{color:var(--gold-l);transform:scale(1.18)}
.tile.path{border-color:rgba(201,162,39,.55);background:rgba(201,162,39,.08)}
.core{grid-column:2/5;grid-row:2/5;border:1px solid var(--gold-d);background:
  radial-gradient(circle at 50% 45%,rgba(201,162,39,.16),rgba(8,9,11,.9) 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px}
.core .ct{font-family:var(--serif);font-size:clamp(19px,3.6vw,27px);letter-spacing:.22em;color:var(--gold-l)}
.core .cs{font-size:10.5px;letter-spacing:.24em;color:var(--dim);text-align:center;line-height:1.9}
.core .cm{display:flex;gap:7px;margin-top:2px}
.core.open{border-color:var(--gold);box-shadow:0 0 40px rgba(201,162,39,.3) inset;animation:glow 2.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 30px rgba(201,162,39,.2) inset}to{box-shadow:0 0 60px rgba(201,162,39,.45) inset}}
.boardbar{margin-top:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.bnote{font-size:12px;color:var(--dim);letter-spacing:.1em;text-align:center;line-height:1.8;margin-top:10px;max-width:40ch}

/* ══ 3D 骰子 ══ */
.dscene{width:110px;height:110px;perspective:800px;cursor:pointer;flex:0 0 auto}
.dcube{width:110px;height:110px;position:relative;transform-style:preserve-3d;
  transform:rotateX(-20deg) rotateY(20deg);transition:transform 1.7s cubic-bezier(.18,.72,.22,1)}
.dcube.spin{transition:transform .1s linear}
.dface{position:absolute;width:110px;height:110px;background:linear-gradient(150deg,#1C1E23,#0D0E11);
  border:1px solid var(--gold-d);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:14px;box-shadow:inset 0 0 26px rgba(0,0,0,.75)}
.pip{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-l),var(--gold-d));
  align-self:center;justify-self:center;box-shadow:0 0 9px rgba(201,162,39,.55)}
.f1{transform:translateZ(55px)} .f6{transform:rotateY(180deg) translateZ(55px)}
.f2{transform:rotateY(90deg) translateZ(55px)} .f5{transform:rotateY(-90deg) translateZ(55px)}
.f3{transform:rotateX(90deg) translateZ(55px)} .f4{transform:rotateX(-90deg) translateZ(55px)}
.dhint{font-size:11px;letter-spacing:.3em;color:var(--gold);animation:bl 2.2s infinite}

/* ══ 判定 ══ */
#check{position:fixed;inset:0;z-index:58;display:none;align-items:center;justify-content:center;
  flex-direction:column;background:rgba(4,5,7,.92);backdrop-filter:blur(4px)}
#check.on{display:flex}
.clabel{font-size:11px;letter-spacing:.44em;color:var(--gold);margin-bottom:24px}
.cmath{margin-top:26px;font-family:var(--serif);font-size:18px;letter-spacing:.1em;color:#CFCBC3;min-height:1.6em}
.cmath b{color:var(--gold-l);font-weight:400}
.cverdict{margin-top:12px;font-family:var(--serif);font-size:28px;letter-spacing:.5em;opacity:0;transition:opacity .5s}
.cverdict.ok{color:var(--gold-l)} .cverdict.no{color:var(--red)}
.cverdict.show{opacity:1}
.ctap{margin-top:26px;font-size:11px;letter-spacing:.3em;color:var(--dim);opacity:0;animation:bl 2.2s .4s infinite}

/* ══ 歷史改寫閃現 ══ */
#rewrite{position:fixed;inset:0;z-index:57;display:none;align-items:center;justify-content:center;
  flex-direction:column;background:rgba(3,8,5,.94)}
#rewrite.on{display:flex}
#rewrite .rt{font-size:11px;letter-spacing:.5em;color:var(--jade);margin-bottom:20px}
#rewrite .rh{font-family:var(--serif);font-size:clamp(26px,5vw,44px);letter-spacing:.14em;color:#DFF0E4;
  text-align:center;max-width:20ch;line-height:1.5;text-shadow:0 0 40px rgba(127,176,138,.4)}
#rewrite .rl{margin-top:22px;width:min(320px,60vw);height:1px;background:linear-gradient(90deg,transparent,var(--jade),transparent)}

.shake{animation:shk .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{10%,90%{transform:translate3d(-2px,0,0)}20%,80%{transform:translate3d(3px,1px,0)}
30%,50%,70%{transform:translate3d(-5px,-1px,0)}40%,60%{transform:translate3d(5px,1px,0)}}

/* 委任狀 */
.warrant{width:min(640px,93vw);border:1px solid var(--line);background:linear-gradient(170deg,rgba(24,26,31,.95),rgba(10,11,14,.97));
  padding:32px 32px 28px;text-align:left;box-shadow:0 40px 100px rgba(0,0,0,.9)}
.warrant .wt{font-family:var(--serif);font-size:14px;letter-spacing:.7em;color:var(--gold);text-align:center;margin-bottom:6px}
.warrant .wh{font-family:var(--serif);font-size:25px;letter-spacing:.35em;text-align:center;margin-bottom:22px}
.fld{margin-bottom:18px}
.fld .fl{font-size:11px;letter-spacing:.3em;color:var(--dim);margin-bottom:8px}
.fld .fl em{font-style:normal;color:var(--gold);letter-spacing:.1em;margin-left:8px;font-size:10.5px}
.inp{background:transparent;border:0;border-bottom:1px solid var(--gold-d);color:var(--gold-l);
  font-family:var(--serif);font-size:23px;padding:4px 2px;outline:none;letter-spacing:.12em;width:100%}
.inp::placeholder{color:rgba(201,162,39,.22)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);padding:9px 15px;font-size:13.5px;cursor:pointer;transition:.2s;color:#CFCBC3;background:rgba(10,11,14,.6)}
.chip:hover{border-color:var(--gold)}
.chip.sel{background:var(--gold);color:#0A0B0D;border-color:var(--gold);font-weight:600}
.chip small{display:block;font-size:10.5px;opacity:.65;margin-top:2px;letter-spacing:.05em}
select.inp{appearance:none;-webkit-appearance:none;font-size:19px;cursor:pointer}
select.inp option{background:#14161A;color:var(--ink)}
.uprow{display:flex;align-items:center;gap:14px}
.upbox{width:72px;height:72px;border:1px dashed var(--gold-d);display:flex;align-items:center;justify-content:center;
  color:var(--gold-d);font-size:24px;cursor:pointer;transition:.25s;flex:0 0 auto;overflow:hidden}
.upbox:hover{border-color:var(--gold);color:var(--gold)}
.upbox img{width:100%;height:100%;object-fit:cover}
.uphint{font-size:11.5px;color:var(--dim);line-height:1.75}

/* 挖掘 */
.digwrap{position:relative;width:min(720px,92vw);aspect-ratio:16/10;border:1px solid var(--line);
  box-shadow:0 40px 110px rgba(0,0,0,.9);overflow:hidden;touch-action:none}
.digwrap .under{position:absolute;inset:0;background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center}
.digwrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.dighint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;pointer-events:none;
  font-size:12px;letter-spacing:.34em;color:rgba(237,234,227,.9);text-shadow:0 1px 8px #000;animation:bl 2.2s .6s infinite}
.plaque{width:min(420px,84%);background:rgba(9,10,12,.92);border:1px solid var(--gold-d);padding:24px 26px;text-align:center}
.plaque .pt{font-family:var(--serif);font-size:12.5px;letter-spacing:.5em;color:var(--gold);margin-bottom:10px}
.plaque .ph{font-family:var(--serif);font-size:28px;letter-spacing:.3em;margin-bottom:10px}
.plaque .pd{font-size:13px;color:#BDB9B1;line-height:2;letter-spacing:.08em}
.plaque .pd b{color:var(--gold-l);font-weight:400}

/* stepper */
.step{display:flex;align-items:center;gap:22px;margin-top:18px}
.sbtn{width:44px;height:44px;border:1px solid var(--line);background:transparent;color:var(--gold);
  font-size:23px;cursor:pointer;font-family:var(--serif);transition:.22s}
.sbtn:hover{border-color:var(--gold);background:rgba(201,162,39,.12)}
.snum{font-family:var(--serif);font-size:46px;color:var(--gold-l);min-width:70px}
.figs{display:flex;gap:9px;justify-content:center;margin-top:12px;min-height:46px;align-items:flex-end}
.fig{width:16px;height:38px;background:linear-gradient(180deg,var(--gold-l),var(--gold-d));
  border-radius:8px 8px 2px 2px;opacity:0;animation:fu .5s forwards;box-shadow:0 0 14px rgba(201,162,39,.45)}

.btn{margin-top:22px;border:1px solid var(--gold);background:transparent;color:var(--gold-l);
  padding:13px 40px;font-size:13px;letter-spacing:.4em;cursor:pointer;transition:.28s;font-family:var(--sans)}
.btn:hover{background:var(--gold);color:#0A0B0D}
.btn.ghost{border-color:var(--line);color:var(--muted);letter-spacing:.2em;padding:11px 24px;font-size:12px}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-l)}
.btn[disabled]{opacity:.35;pointer-events:none}
.brow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

.render{width:min(520px,88vw);text-align:center}
.bar{height:2px;background:rgba(201,162,39,.18);margin-top:22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 12px var(--gold);transition:width .35s}
.rlog{margin-top:16px;font-size:12.5px;letter-spacing:.16em;color:var(--dim);min-height:2.4em;line-height:1.9}

.film{width:min(940px,94vw);position:relative}
.film video{width:100%;display:block;border:1px solid var(--line);background:#000;box-shadow:0 40px 120px rgba(0,0,0,.9)}
.overlayName{position:absolute;left:24px;bottom:60px;text-align:left;pointer-events:none;
  text-shadow:0 2px 14px rgba(0,0,0,.9);opacity:0;transition:opacity 1.5s}
.overlayName.on{opacity:1}
.overlayName .k{font-size:10px;letter-spacing:.4em;color:var(--gold-l);margin-bottom:6px}
.overlayName .n{font-family:var(--serif);font-size:25px;letter-spacing:.2em;color:#fff}
.overlayName .m{font-family:var(--serif);font-size:13.5px;letter-spacing:.1em;color:rgba(237,234,227,.85);margin-top:6px}
.filmcap{margin-top:12px;font-size:12px;letter-spacing:.26em;color:var(--gold);text-align:center}
.filmsub{margin-top:8px;font-size:12px;letter-spacing:.2em;color:var(--dim);text-align:center;cursor:pointer}

.an{width:min(840px,94vw);text-align:left}
.antype{text-align:center;margin-bottom:26px}
.antype .k{font-size:11px;letter-spacing:.44em;color:var(--gold);margin-bottom:12px}
.antype .t{font-family:var(--serif);font-size:clamp(36px,6.2vw,60px);letter-spacing:.14em;line-height:1.15}
.antype .s{margin-top:10px;font-size:14px;color:var(--muted);letter-spacing:.1em}
.bars{margin:22px 0}
.brow2{display:flex;align-items:center;gap:15px;margin-bottom:11px}
.brow2 .bl{flex:0 0 62px;font-size:12px;letter-spacing:.18em;color:var(--muted)}
.brow2 .bt{flex:1;height:7px;background:rgba(201,162,39,.13);position:relative}
.brow2 .bt i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));
  transition:width 1.1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px rgba(201,162,39,.5)}
.brow2 .bv{flex:0 0 40px;text-align:right;font-family:var(--serif);font-size:16px;color:var(--gold-l)}
.hist{border:1px solid rgba(127,176,138,.35);background:rgba(127,176,138,.07);padding:18px 22px;margin:18px 0}
.hist .hh{font-size:11px;letter-spacing:.3em;color:var(--jade);margin-bottom:12px}
.hist .hi{font-family:var(--serif);font-size:16px;color:#CFE5D4;line-height:2;padding-left:16px;position:relative}
.hist .hi::before{content:"◆";position:absolute;left:0;color:var(--jade);font-size:10px;top:6px}
.achv{border-top:1px solid rgba(201,162,39,.16);padding-top:6px;margin-top:8px}
.ach{padding:13px 0;border-bottom:1px solid rgba(201,162,39,.09)}
.ach .at{font-family:var(--serif);font-size:16.5px;color:var(--gold-l);letter-spacing:.06em;margin-bottom:5px}
.ach .ad{font-size:13.5px;color:#BDB9B1;line-height:1.85}
.voice{margin-top:20px;padding:18px 22px;border-left:2px solid var(--gold);background:rgba(201,162,39,.06)}
.voice .vq{font-family:var(--serif);font-size:16.5px;line-height:1.9;color:#E4E0D8}
.voice .vw{margin-top:10px;font-size:11.5px;letter-spacing:.24em;color:var(--gold)}

.rec{width:min(560px,90vw);border:1px solid var(--line);background:linear-gradient(170deg,rgba(24,26,31,.95),rgba(10,11,14,.97));
  padding:34px 30px;text-align:left;box-shadow:0 40px 100px rgba(0,0,0,.9)}
.rec .rt{font-family:var(--serif);font-size:12px;letter-spacing:.5em;color:var(--gold);text-align:center;margin-bottom:18px}
.rl{display:flex;padding:10px 0;border-bottom:1px solid rgba(201,162,39,.1);font-size:15px;align-items:baseline}
.rl:last-child{border:0}
.rl .a{flex:0 0 88px;font-size:11.5px;letter-spacing:.24em;color:var(--dim)}
.rl .b{flex:1;font-family:var(--serif);font-size:16.5px;color:var(--ink)}
.rl .b.gold{color:var(--gold-l)}
.bs{width:100%;text-align:left;background:rgba(6,7,9,.94);border:1px solid var(--line);padding:28px 26px;
    box-shadow:0 40px 100px rgba(0,0,0,.9)}
.bsh{display:flex;align-items:baseline;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.bsh .t{font-family:var(--serif);font-size:23px;letter-spacing:.08em}
.bsh .s{font-size:11px;letter-spacing:.3em;color:var(--gold)}
.bsub{font-size:13.5px;color:var(--muted);margin-bottom:20px;line-height:1.8}
.tbl{border:1px solid var(--line);margin-bottom:18px;overflow:hidden}
.trow{display:flex;border-bottom:1px solid rgba(201,162,39,.1);font-size:13.5px}
.trow:last-child{border:0}
.trow.h{background:rgba(201,162,39,.09);font-size:11px;letter-spacing:.2em;color:var(--gold)}
.trow>div{padding:10px 13px;line-height:1.7}
.c1{flex:0 0 104px;color:var(--dim);border-right:1px solid rgba(201,162,39,.1)}
.c2{flex:1.1;color:#D6D2CA;border-right:1px solid rgba(201,162,39,.1)}
.c3{flex:1;color:var(--gold-l);font-weight:600}
.brief{border:1px solid var(--gold-d);background:rgba(201,162,39,.07);padding:18px 20px;font-size:14.5px;line-height:2}
.brief .bh{font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:10px}
.brief em{color:var(--gold-l);font-style:normal}

#flash{position:fixed;inset:0;background:#000;z-index:60;opacity:0;pointer-events:none;transition:opacity .55s}
#flash.on{opacity:1;pointer-events:all}
.note{font-size:12.5px;color:var(--dim);line-height:1.9;margin-top:14px;max-width:56ch}
.skip{position:absolute;right:20px;bottom:14px;z-index:45;font-size:11px;letter-spacing:.26em;
  color:rgba(154,150,142,.5);cursor:pointer;transition:.3s}
.skip:hover{color:var(--gold-l)}

@media(max-width:640px){
  .stage{width:95vw}
  #hud{padding:10px 12px;font-size:9.5px;letter-spacing:.1em;gap:8px}
  .warrant,.rec,.bs{padding:22px 16px}
  .c1{flex:0 0 74px}.trow{font-size:12.5px}
  .opt .tags{margin-left:0;width:100%}
  .tile .nm{font-size:7.5px}.tile .ic{font-size:14px}
  .dscene,.dcube,.dface{width:88px;height:88px}
  .f1{transform:translateZ(44px)}.f6{transform:rotateY(180deg) translateZ(44px)}
  .f2{transform:rotateY(90deg) translateZ(44px)}.f5{transform:rotateY(-90deg) translateZ(44px)}
  .f3{transform:rotateX(90deg) translateZ(44px)}.f4{transform:rotateX(-90deg) translateZ(44px)}
  .pip{width:12px;height:12px}
}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div><div id="vig"></div><div id="grain"></div><div id="pov"></div>
  <div id="hud">
    <div id="hname">寶城典藏館</div>
    <div id="clock" class=""></div>
    <div class="marks" id="marks"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="skip" id="skip" style="display:none">略過 →</div>
</div>
<div id="check">
  <div class="clabel" id="cl">判 定</div>
  <div class="dscene"><div class="dcube" id="ccube"></div></div>
  <div class="cmath" id="cm"></div>
  <div class="cverdict" id="cv"></div>
  <div class="ctap" id="ct" style="display:none">點 擊 繼 續</div>
</div>
<div id="rewrite">
  <div class="rt">歷 史 已 改 寫</div>
  <div class="rh" id="rwh"></div>
  <div class="rl"></div>
</div>
<div id="flash"></div>

<script src="board.js"></script>
<script>
/* ═══════════════════════════════════════════════
   夜巡 v5 — 大富翁式路徑・真骰子・可改寫的歷史
   ═══════════════════════════════════════════════ */

const S={
  name:'',sur:'',birth:1976,age:50,photo:null,
  marital:'',career:'',relic:'',risk:'',
  pos:0,lap:0,time:360,marks:0,visited:{},
  flags:{},data:{},changed:[],rolls:[],
  ax:{事業:0,家庭:0,傳承:0},
  dim:{決斷:0,傳承:0,風險:0,情感:0,遠見:0},
  last:null,family:0,roles:[],motto:''
};
const el=id=>document.getElementById(id);
const stage=el('stage'),bgEl=el('bg'),app=el('app');
const still='animation:none;opacity:1;transform:none';
const RELIC_BONUS={pen:['決斷',2],watch:['傳承',2],photo:['情感',2],key:['風險',2]};
const NEED_MARKS=4;

function setTap(fn){app.onclick=fn;app.style.cursor=fn?'pointer':'default';}
function setBg(src){
  if(!src){bgEl.classList.remove('on');return;}
  bgEl.classList.remove('on');
  setTimeout(()=>{bgEl.style.backgroundImage=`url('${src}')`;bgEl.classList.add('on');},120);
}
function pov(on){document.body.classList.toggle('pov',on);el('pov').classList.toggle('on',on);}
function hud(on){el('hud').classList.toggle('on',on);paint();}
function shake(){app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');}
function paint(){
  if(S.name)el('hname').innerHTML=`第 <b>087</b> 任 ・ ${S.name}`;
  const t=Math.max(0,S.time);
  el('clock').className=t<=90?'low':'';
  el('clock').innerHTML=t>0?`天亮還有 <b>${Math.floor(t/60)}</b> 小時 <b>${String(t%60).padStart(2,'0')}</b> 分`:`<b>天 亮 了</b>`;
  el('marks').innerHTML='<span style="margin-right:7px">印記</span>'+
    Array.from({length:NEED_MARKS},(_,i)=>`<span class="mk ${i<S.marks?'f':''}"></span>`).join('');
}
function fade(fn){el('flash').classList.add('on');setTimeout(()=>{fn();el('flash').classList.remove('on');},520);}
function spend(m){S.time-=m;paint();}

/* ── 骰面 ── */
const PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function faceHTML(n){
  let h='';for(let i=1;i<=9;i++)h+=PIPS[n].includes(i)?'<div class="pip"></div>':'<div></div>';
  return h;
}
function buildCube(cube){
  cube.innerHTML=[1,2,3,4,5,6].map(n=>`<div class="dface f${n}">${faceHTML(n)}</div>`).join('');
}
const FACE_ROT={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
function tumble(cube,n,then){
  cube.classList.add('spin');
  let k=0;
  const iv=setInterval(()=>{
    cube.style.transform=`rotateX(${Math.random()*720-360}deg) rotateY(${Math.random()*720-360}deg)`;
    if(++k>=9){
      clearInterval(iv);
      cube.classList.remove('spin');
      const[rx,ry]=FACE_ROT[n];
      cube.style.transform=`rotateX(${rx+720}deg) rotateY(${ry+720}deg)`;
      setTimeout(then,1800);
    }
  },95);
}

/* ── 能力判定（用真骰子 d20 概念，但視覺用 d6×3 太複雜 → 用 d20 數字＋骰子動畫）── */
function check(c,then){
  const box=el('check');
  if(box.classList.contains('on'))return;
  box.classList.add('on');
  el('cl').textContent=`判 定 ・ ${c.stat} ${c.dc}`;
  el('cv').className='cverdict';el('cv').textContent='';el('cm').innerHTML='';el('ct').style.display='none';
  const cube=el('ccube');buildCube(cube);
  const d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6),d3=1+Math.floor(Math.random()*6);
  const rb=RELIC_BONUS[S.relic]||['',0];
  const bonus=rb[0]===c.stat?rb[1]:0;
  const total=d1+d2+d3+bonus;
  tumble(cube,d1,()=>{
    el('cm').innerHTML=`第一顆 <b>${d1}</b>`;
    tumble(cube,d2,()=>{
      el('cm').innerHTML=`<b>${d1}</b> ＋ <b>${d2}</b>`;
      tumble(cube,d3,()=>{
        const ok=total>=c.dc;
        el('cm').innerHTML=`<b>${d1}</b> ＋ <b>${d2}</b> ＋ <b>${d3}</b>${bonus?` ＋ 隨身之物 <b>${bonus}</b>`:''} ＝ <b>${total}</b>　${ok?'≥':'＜'}　${c.dc}`;
        setTimeout(()=>{
          const v=el('cv');v.textContent=ok?'成 功':'失 敗';v.classList.add(ok?'ok':'no','show');
          el('ct').style.display='block';
          S.rolls.push({stat:c.stat,dc:c.dc,total,ok});
          box.onclick=()=>{box.classList.remove('on');box.onclick=null;then(ok);};
        },520);
      });
    });
  });
}

/* ── 歷史改寫閃現 ── */
function rewrite(text,then){
  const r=el('rewrite');el('rwh').textContent=text;r.classList.add('on');
  setTimeout(()=>{r.classList.remove('on');then();},2600);
}

/* ── 對白 ── */
function play(o){
  if(o.bg!==undefined)setBg(o.bg);
  let i=0;const all=o.lines||[];
  const draw=()=>{
    stage.innerHTML=(o.spk?`<div class="spk" style="${still}">${o.spk}</div>`:'')
      +(o.era?`<div class="era" style="${still}">${o.era}</div>`:'')
      +all.slice(0,i+1).map((t,k)=>`<div class="ln" style="${k<i?still:''}">${t}</div>`).join('')
      +(i<all.length-1?`<div class="tap">點擊繼續</div>`:'');
    stage.scrollTop=stage.scrollHeight;
  };
  const next=()=>{i<all.length-1?(i++,draw()):(setTap(null),o.render());};
  all.length?(setTap(next),draw()):(setTap(null),o.render());
}

/* ── 通用提問 ── */
function ask(o){
  play({bg:o.bg,spk:o.spk,era:o.era,lines:o.lines,render(){
    const recap=S.last?`<div class="recap"><div class="rk">上 一 個 決 定</div>
      <div class="rv">「<b>${S.last.t}</b>」${S.last.note?` ── ${S.last.note}`:''}
      <span class="tags">${(S.last.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</span></div></div>`:'';
    stage.innerHTML=recap
      +(o.spk?`<div class="spk" style="${still}">${o.spk}</div>`:'')
      +(o.era?`<div class="era" style="${still}">${o.era}</div>`:'')
      +(o.lines||[]).map(t=>`<div class="ln" style="${still}">${t}</div>`).join('')
      +`<div class="ln q" style="${still}">${o.q}</div>`
      +`<div class="opts">`+o.opts.map((p,k)=>
        `<div class="opt" data-k="${k}" style="animation-delay:${.09+k*.07}s">
           <span class="oi">${'一二三四五'[k]}</span><span class="ot">${p.t}</span>
           <span class="tags">${p.check?`<span class="tag chk">判定 ${p.check.stat} ${p.check.dc}</span>`:''}${p.changed?'<span class="tag chg">改寫歷史</span>':''}${(p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</span>
         </div>`).join('')+`</div>`;
    let answered=false;
    stage.querySelectorAll('.opt').forEach(n=>n.onclick=e=>{
      e.stopPropagation();
      if(answered)return;answered=true;
      const p=o.opts[+n.dataset.k];
      const apply=(note,tags)=>{
        if(o.key)S.data[o.key]={a:p.t,field:o.field,val:p.val};
        if(p.flag)S.flags[p.flag[0]]=p.flag[1];
        if(p.ax)for(const k in p.ax)S.ax[k]+=p.ax[k];
        if(p.dim)for(const k in p.dim)S.dim[k]+=p.dim[k];
        S.last={t:p.t,note:note||'',tags:tags||[]};
        o.done();
      };
      if(p.check){
        check(p.check,ok=>{
          const r=ok?(p.win||{}):(p.fail||{});
          if(!ok&&r.penalty)spend(r.penalty);
          if(ok&&p.changed){
            S.changed.push(p.changed);
            rewrite(p.changed,()=>apply(r.note||p.note,(r.tags||p.tags)));
            return;
          }
          apply(r.note||p.note,(r.tags||p.tags));
        });
      }else{
        if(p.penalty)spend(p.penalty);
        apply(p.note,p.tags);
      }
    });
  }});
}

/* ── 落點後的收尾（給印記 → 回棋盤）── */
function afterTile(gainMark){
  const tail=[];
  if(S.last&&S.last.note)tail.push(`<div class="ln">${S.last.note}</div>`);
  if(gainMark){S.marks++;paint();
    tail.push(`<div class="ln q" style="animation-delay:.4s">你在紀錄冊上蓋下一枚印記。</div>`);
    tail.push(`<div class="spk" style="animation-delay:.8s;margin-top:14px">印記 ${S.marks} / ${NEED_MARKS}</div>`);}
  stage.innerHTML=tail.join('')+`<div class="tap" style="animation-delay:1.2s">點擊繼續</div>`;
  setTap(()=>{setTap(null);fade(()=>go(S.marks>=NEED_MARKS?'unlock':'board'));});
}

const SC={};

/* ══ 序章 ══ */
SC.prologue=()=>{
  hud(false);pov(true);
  const B=[
    {bg:'assets/13_pov_letter.jpg',t:4200,l:['深夜十一點四十分。','司機還在等，你在後座拆開這封信。']},
    {bg:'assets/13_pov_letter.jpg',t:4400,l:['沒有署名。','只有一個地址、一枚火漆，和一句話——','<span style="color:var(--gold-l)">「本館遺失了一件東西。只有你能找回來。」</span>']},
    {bg:'assets/01_door.jpg',t:4000,l:['地址在你公司地下二樓。','那扇你走過十年、從來沒開過的鐵門。','今晚，它是開的。']},
    {bg:'assets/14_pov_corridor.jpg',t:4200,l:['門後不是倉庫。','是一條不該存在的長廊。','展櫃裡的東西，你在課本上見過。']},
    {bg:'assets/14_pov_corridor.jpg',t:3600,l:['走廊盡頭有燈。','桌上放著一份文件，等你簽。']}
  ];
  el('skip').style.display='block';
  let i=0,timer;
  const end=()=>{clearTimeout(timer);el('skip').style.display='none';pov(false);fade(()=>go('warrant'));};
  el('skip').onclick=end;
  const beat=()=>{
    if(i>=B.length)return end();
    const b=B[i];setBg(b.bg);
    stage.innerHTML=b.l.map((t,k)=>`<div class="ln" style="animation-delay:${.4+k*.85}s">${t}</div>`).join('');
    timer=setTimeout(beat,b.t);i++;
  };beat();
};

/* ══ 委任狀 ══ */
SC.warrant=()=>{
  setBg('assets/01_door.jpg');
  const years=[];for(let y=1996;y>=1946;y--)years.push(y);
  stage.innerHTML=`
  <div class="warrant">
    <div class="wt">寶 城 典 藏 館</div><div class="wh">館長委任狀</div>
    <div class="fld"><div class="fl">姓 名 <em>紀錄冊將以全名落款</em></div>
      <input class="inp" id="nm" maxlength="6" placeholder="請輸入全名"></div>
    <div style="display:flex;gap:20px;flex-wrap:wrap">
      <div class="fld" style="flex:1;min-width:140px"><div class="fl">出 生 年</div>
        <select class="inp" id="by">${years.map(y=>`<option value="${y}" ${y===1976?'selected':''}>${y} 年</option>`).join('')}</select></div>
      <div class="fld" style="flex:2;min-width:220px"><div class="fl">身 分 <em>之後的夜裡會用到</em></div>
        <div class="chips" id="ms"><div class="chip" data-v="single">未婚</div><div class="chip" data-v="married">已婚</div><div class="chip" data-v="kids">已婚・有小孩</div></div></div>
    </div>
    <div class="fld"><div class="fl">現 在 的 你</div>
      <div class="chips" id="cs">
        <div class="chip" data-v="build">還在打拚<small>事業向上，時間最貴</small></div>
        <div class="chip" data-v="own">當家做主<small>一個人說了算</small></div>
        <div class="chip" data-v="pass">開始想交棒<small>在意留下什麼</small></div></div></div>
    <div class="fld"><div class="fl">隨 身 帶 一 件 東 西 <em>會成為你的判定加成</em></div>
      <div class="chips" id="rl">
        <div class="chip" data-v="pen">簽第一張合約的筆<small>決斷 +2</small></div>
        <div class="chip" data-v="watch">父親留下的錶<small>傳承 +2</small></div>
        <div class="chip" data-v="photo">一張全家福<small>情感 +2</small></div>
        <div class="chip" data-v="key">公司大門的鑰匙<small>風險 +2</small></div></div></div>
    <div class="fld"><div class="fl">館 規 第 三 條 ・ 若 館 藏 有 損</div>
      <div class="chips" id="rk"><div class="chip" data-v="self">我自己賠</div><div class="chip" data-v="share">全館分攤</div><div class="chip" data-v="insure">早該先保起來</div></div></div>
    <div class="fld"><div class="fl">館 長 的 樣 子 <em>選填・影像只留在此裝置</em></div>
      <div class="uprow"><div class="upbox" id="up">＋</div>
        <input type="file" id="fi" accept="image/*" style="display:none">
        <div class="uphint">上傳正面照，結尾的交接影像會以您的形象生成。</div></div></div>
    <div style="text-align:center"><button class="btn" id="go" disabled>就　任</button></div>
  </div>`;
  const need={nm:0,ms:0,cs:0,rl:0,rk:0};
  const chk=()=>el('go').disabled=!Object.values(need).every(Boolean);
  el('nm').oninput=e=>{need.nm=e.target.value.trim().length>=2;chk();};
  [['ms','marital'],['cs','career'],['rl','relic'],['rk','risk']].forEach(([id,key])=>{
    el(id).querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
      el(id).querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel');S[key]=c.dataset.v;need[id]=1;chk();});
  });
  el('up').onclick=()=>el('fi').click();
  el('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{S.photo=ev.target.result;el('up').innerHTML=`<img src="${S.photo}">`;};r.readAsDataURL(f);};
  el('go').onclick=()=>{
    S.name=el('nm').value.trim();S.sur=S.name[0];
    S.birth=+el('by').value;S.age=new Date().getFullYear()-S.birth;
    const RL={pen:['開創型','簽第一張合約的筆',{決斷:2,遠見:1},{事業:2}],
              watch:['承繼型','父親留下的錶',{傳承:2,情感:1},{傳承:2}],
              photo:['守護型','一張全家福',{情感:2,傳承:1},{家庭:2}],
              key:['掌權型','公司大門的鑰匙',{決斷:2,風險:1},{事業:2}]}[S.relic];
    S.data.relic={field:'性格原型',a:RL[1],val:RL[0]};
    for(const k in RL[2])S.dim[k]+=RL[2][k];for(const k in RL[3])S.ax[k]+=RL[3][k];
    const RK={self:['自留風險 ・ 對保險抗性高',{決斷:1,風險:3}],share:['共同分攤 ・ 接受互助制度',{情感:2,風險:2}],insure:['事前移轉 ・ 保險接受度高',{遠見:3,風險:1}]}[S.risk];
    S.data.risk={field:'風險態度',a:{self:'我自己賠',share:'全館分攤',insure:'早該先保起來'}[S.risk],val:RK[0]};
    for(const k in RK[1])S.dim[k]+=RK[1][k];
    S.data.base={field:'基本資料',a:`${S.birth} 年生 ・ ${S.age} 歲 ・ ${{single:'未婚',married:'已婚',kids:'已婚有子女'}[S.marital]}`,
                 val:{build:'事業建立期',own:'當家期',pass:'交棒準備期'}[S.career]};
    fade(()=>go('enter'));
  };
};

/* ══ 進館 ══ */
SC.enter=()=>{
  hud(false);pov(true);
  play({bg:'assets/14_pov_corridor.jpg',spk:'你 的 視 角',
    lines:['簽完名，走廊的燈一盞一盞暗下去。',
           '你打開手電筒。玻璃櫃裡，有東西跟著你轉頭。',
           '大廳的鐘敲了十二下。',
           '<span style="color:var(--gold-l)">第十二響落下的瞬間——整層樓都醒了。</span>'],
    render(){shake();setTimeout(()=>fade(()=>go('dust')),650);}});
};

/* ══ 撥灰：看見任務 ══ */
SC.dust=()=>{
  pov(true);
  dig({bg:'assets/02_vitrine.jpg',spk:'零 時',
    lines:['中央展櫃是空的。玻璃上積了一層灰。'],
    mode:'dust',hint:'按 住 ， 用 手 擦 開 灰 塵',threshold:.5,
    underHtml:`<div class="plaque"><div class="pt">館 藏 第 一 號</div><div class="ph">翠玉白菜</div>
      <div class="pd">清 ・ 光緒年間 ・ 瑾妃嫁妝<br>葉上雕螽斯與蝗蟲二蟲，寓 <b>多子多孫</b><br><br><b>── 螽斯，於昨夜失蹤 ──</b></div></div>`,
    onDone(){
      setTap(null);pov(false);hud(true);
      stage.insertAdjacentHTML('beforeend',
        `<div class="ln q" style="margin-top:20px">六點鐘響，一切歸位。它沒回來，就永遠不在了。</div>

/* ══ 棋盤 ══ */
function tileClass(t,idx){
  let c='tile t-'+t.type;
  if(idx===S.pos)c+=' here';
  if(S.visited[idx])c+=' done';
  return c;
}
SC.board=()=>{
  setBg('assets/02_vitrine.jpg');pov(false);hud(true);
  if(S.time<=0)return go('timeup');
  const cells=Array.from({length:25},()=>'');
  BOARD.forEach((t,idx)=>{
    const[c,r]=CELLS[idx];
    cells[(r-1)*5+(c-1)]=`<div class="${tileClass(t,idx)}" style="grid-column:${c};grid-row:${r}">
        <div class="ic">${t.icon}</div><div class="nm">${t.name}</div></div>`;
  });
  const open=S.marks>=NEED_MARKS;
  stage.innerHTML=`
    <div class="boardwrap">
      <div class="board">
        ${cells.filter(Boolean).join('')}
        <div class="core ${open?'open':''}">
          <div class="ct">翠玉白菜</div>
          <div class="cs">${open?'櫃 門 已 解 鎖':`需要 ${NEED_MARKS} 枚印記`}</div>
          <div class="cm">${Array.from({length:NEED_MARKS},(_,i)=>`<span class="mk ${i<S.marks?'f':''}"></span>`).join('')}</div>
        </div>
      </div>
      <div class="boardbar">
        <div class="dscene" id="ds"><div class="dcube" id="bcube"></div></div>
        <div>
          <div class="dhint" id="dh">點 骰 子 前 進</div>
          <div style="font-size:11.5px;color:var(--dim);letter-spacing:.1em;margin-top:8px">每走一步 −8 分</div>
        </div>
      </div>
      <div class="bnote">你現在在<b style="color:var(--gold-l)">「${BOARD[S.pos].name}」</b>。
      骰子決定你走到哪——<br>每個人遇到的文物、歷史與危機都不一樣。</div>
    </div>`;
  const cube=el('bcube');buildCube(cube);
  let rolled=false;
  el('ds').onclick=()=>{
    if(rolled)return;rolled=true;
    el('dh').textContent='⋯⋯';
    const n=1+Math.floor(Math.random()*6);
    tumble(cube,n,()=>{
      el('dh').innerHTML=`前 進 <b style="color:var(--gold-l)">${n}</b> 步`;
      setTimeout(()=>stepMove(n),500);
    });
  };
};
function stepMove(n){
  let left=n;
  const hop=()=>{
    if(left<=0){
      spend(8*n);
      setTimeout(()=>fade(()=>go('land')),450);return;
    }
    S.pos=(S.pos+1)%16;
    if(S.pos===0)S.lap++;
    left--;
    document.querySelectorAll('.tile').forEach((el2,i)=>{
      el2.className=tileClass(BOARD[i],i);
    });
    setTimeout(hop,230);
  };
  hop();
}

/* ══ 落點分派 ══ */
SC.land=()=>{
  const t=BOARD[S.pos];
  const seen=S.visited[S.pos];
  S.visited[S.pos]=true;
  if(t.type==='start')return go('startTile');
  if(seen)return go('revisit');
  if(t.type==='relic')  return relicTile(RELICS[t.key]);
  if(t.type==='history')return historyTile(HISTORY[t.key]);
  if(t.type==='crisis') return crisisTile(CRISES[t.key]);
  if(t.type==='chance') return chanceTile();
};

/* 文物格 */
function relicTile(R){
  if(R.shake){shake();setTimeout(shake,800);}
  let block=R;
  if(R.branch==='marital')block=(S.marital==='single')?R.single:R.family;
  if(R.branch==='kids')   block=(S.marital==='kids')?R.haskids:R.nokids;
  ask({bg:R.bg,spk:`${R.who}`,lines:R.intro,q:block.q,field:block.field,key:block.key,opts:block.opts,
    done(){
      if(R.outro)S.last.note=(S.last.note?S.last.note+'　':'')+R.outro;
      spend(20);afterTile(true);
    }});
}
/* 歷史格 */
function historyTile(H){
  ask({bg:H.bg,spk:`歷 史 節 點 ・ ${H.title}`,era:H.era,lines:H.intro,q:H.q,opts:H.opts,
    done(){spend(25);afterTile(true);}});

function crisisTile(C){

    done(){spend(15);afterTile(false);}});

/* 機會格 */
function chanceTile(){
  const c=CHANCES[Math.floor(Math.random()*CHANCES.length)];

    lines:[`<span style="color:var(--gold-l)">${c.t}</span>`,c.d],

      S.last={t:c.t,note:c.d,tags:[c.time?(c.time>0?`時間 +${c.time}`:`時間 ${c.time}`):'',c.mark?'印記 ＋1':''].filter(Boolean)};
      spend(10);afterTile(!!c.mark);
    }});
}

/* ══ 分析 ══ */
function achievements(){
  const A=[],f=S.flags;
  const wins=S.rolls.filter(r=>r.ok).length,fails=S.rolls.length-wins;
  if(S.changed.length>=2)A.push(['改寫了不只一次','你動了兩處以上的歷史。館藏目錄因此重編過——沒有人知道原本該長什麼樣。']);
  if(S.changed.length===1)A.push(['你動了一次手','歷史被改了一個地方。只有你知道是哪裡。']);
  if(!S.changed.length)A.push(['你什麼都沒改','每一個節點你都讓它按原樣發生。守成也是一種立場。']);
  if(f.seal==='clean')A.push(['不留痕跡','你連皇帝的章都擋了。守一樣東西守到自己都不碰，這種人不多。']);
  if(f.marry==='solo')A.push(['一個人也很好','你不是沒想過。你是想清楚了。']);
  if(f.kids==='want')A.push(['你算過那筆錢','算完之後，你還是說要。']);
  if(f.kids==='maybe')A.push(['還在算','日子不會等試算表。牠等了一夜，你打算等幾年？']);
  if(f.prio==='home')A.push(['你回了家','館裡少你一晚不會怎樣。家裡少你一晚，有人記一輩子。']);
  if(f.legacy==='none')A.push(['還沒開始安排','八十六任裡有六十三位跟你一樣。差別是，他們大多在三年內動了手。']);
  if(S.risk==='self')A.push(['「我自己賠」','第 4、17、52、81 任都說過同一句。其中兩位，真的賠了。']);
  if(S.rolls.length>=2&&fails===0)A.push(['連骰子都站你這邊','每一次判定都過了。有些夜晚就是這樣。']);
  if(fails>=2)A.push(['手氣不好的那一夜','兩次以上沒過。而你還是走到了最後。']);
  if(S.flags.late)A.push(['你來不及','天亮的時候你還缺印記。牠自己回來了——這一次。']);
  return A.slice(0,4);
}

}

      <div class="rl"><div class="a">巡 經</div><div class="b">${Object.keys(S.visited).length} 個位置 ・ 印記 ${S.marks}</div></div>
      ${S.changed.length?`<div class="rl"><div class="a">歷 史</div><div class="b" style="color:var(--jade)">改寫 ${S.changed.length} 處</div></div>`:''}
      <div class="rl"><div class="a">附 記</div><div class="b gold">「${S.motto}」</div></div>
    </div>
    <div class="ln q" style="font-size:18px;margin-top:22px">「紀錄冊需謄抄七日。留下地址，親自送到您手上。」</div>
    <div class="brow" style="margin-top:16px">
      <button class="btn" id="f">留 下 聯 絡 方 式</button>
      <button class="btn ghost" id="s">跳過，看後台</button></div>`;
  el('f').onclick=()=>{
    stage.innerHTML=`<div class="spk" style="${still}">實 體 交 付</div>
      <div class="ln q" style="font-size:19px;${still}">紀錄冊將由專屬顧問親送。</div>
      <input class="inp" placeholder="行動電話" style="width:min(520px,80vw);margin-top:20px;font-size:19px;text-align:center">
      <input class="inp" placeholder="送達地址" style="width:min(520px,80vw);margin-top:16px;font-size:19px;text-align:center">
      <button class="btn" id="d">送 出</button>
      <div class="note" style="text-align:center">Demo 不會送出任何資料。</div>`;
    el('d').onclick=()=>fade(()=>go('backstage'));};
  el('s').onclick=()=>fade(()=>go('backstage'));
};

SC.backstage=()=>{
  setBg('');hud(false);
  const rows=Object.values(S.data).map(d=>
    `<div class="trow"><div class="c1">${d.field}</div><div class="c2">${d.a}</div><div class="c3">${d.val}</div></div>`).join('');
  const f=S.flags;
  const anx=f.legacy==='none'?'傳承尚未啟動——最大切入空間'
    :f.kids==='maybe'?'生育猶豫期——以教育金試算切入'
    :f.legacy==='blood'?'子女承接已定——保額與信託架構檢視'
    :f.marry==='want'?'成家意願明確——未來家庭保障規劃'
    :'以其當前人生階段切入';
  const open=f.prio==='home'?'從家人切入——他選過「回家」，這是他的答案'
    :f.prio==='work'?'先談事業與資產效率，家庭議題後置'
    :f.marry==='solo'?'尊重單身選擇，以自身退休與醫療為核心，勿推家庭商品'
    :'從他今晚的選擇談起，不要從商品談起';
  const resist=S.risk==='self'?'高——第一次見面完全不要提商品'
    :S.risk==='share'?'中——可從互助概念自然帶入':'低——可較早進入規劃討論';
  const wins=S.rolls.filter(r=>r.ok).length;
  stage.innerHTML=`
    <div class="bs">
      <div class="bsh"><span class="s">顧 問 後 台</span><span class="t">${S.name}　客戶檔案</span>
        <span style="font-size:12px;color:var(--dim);margin-left:auto">第 087 號 ・ ${S.age} 歲</span></div>
      <div class="bsub">同一份體驗，客戶看到的是故事、影像與裁決分析；顧問看到的是這一頁。<br>
        <b style="color:var(--gold-l)">客戶從頭到尾沒有填過一張表格。</b></div>
      <div class="tbl">
        <div class="trow h"><div class="c1">欄位</div><div class="c2">他在遊戲裡的回答</div><div class="c3">系統判讀</div></div>
        ${rows}
        <div class="trow"><div class="c1">人生信條</div><div class="c2">「${S.motto}」</div><div class="c3">親筆附記 ・ 破冰最強素材</div></div>
        <div class="trow"><div class="c1">影像</div><div class="c2">${S.photo?'已上傳本人照片':'未上傳'}</div><div class="c3">${S.photo?'可生成專屬交接影像':'以預設形象產出'}</div></div>
        <div class="trow"><div class="c1">風險行為</div><div class="c2">${S.rolls.length?`主動判定 ${S.rolls.length} 次 ・ 成 ${wins} 敗 ${S.rolls.length-wins}`:'全程避開所有判定'}</div>
          <div class="c3">${S.rolls.length>=3?'高風險耐受 ・ 賭性可引導':S.rolls.length?'選擇性冒險 ・ 中度風險偏好':'保守決策 ・ 訴求確定性商品'}</div></div>
        <div class="trow"><div class="c1">介入傾向</div><div class="c2">${S.changed.length?`改寫歷史 ${S.changed.length} 處`:'完全不介入歷史'}</div>
          <div class="c3">${S.changed.length>=2?'主動介入型 ・ 願為結果承擔':S.changed.length?'選擇性介入':'尊重既定秩序 ・ 不輕易變動架構'}</div></div>
      </div>
      <div class="brief"><div class="bh">系 統 建 議 ・ 首 次 接 觸</div>
        推銷抗性：<em>${resist}</em><br>
        開場建議：<em>${open}</em>。<br>
        優先議題：<em>${anx}</em>；受益／受扶養對象 <em>${S.family} 人</em>。<br>
        可用破冰句：他親手寫下「<em>${S.motto}</em>」——見面時從這句開始。</div>
      <div class="note" style="margin-top:20px">
        後台<b style="color:var(--gold-l)">不丟原始欄位給業務員，只丟「怎麼開口」</b>。</div>
      <div class="brow" style="margin-top:24px;justify-content:flex-start">
        <button class="btn" id="r">重 新 體 驗</button></div>
    </div>`;
  el('r').onclick=()=>location.reload();
};

/* ── 撥開／挖掘 ── */
function dig(o){
  setBg(o.bg||'');
  stage.innerHTML=(o.spk?`<div class="spk" style="${still}">${o.spk}</div>`:'')
    +(o.lines||[]).map(t=>`<div class="ln" style="${still}">${t}</div>`).join('')
    +`<div class="digwrap" id="dw"><div class="under" id="du"></div><canvas id="dc"></canvas>
       <div class="dighint" id="dh2">${o.hint}</div></div>`;
  const du=el('du');
  if(o.underImg)du.style.backgroundImage=`url('${o.underImg}')`;
  if(o.underHtml)du.innerHTML=o.underHtml;
  const wrap=el('dw'),cv=el('dc'),ctx=cv.getContext('2d',{willReadFrequently:true});
  const W=wrap.clientWidth,H=wrap.clientHeight;cv.width=W;cv.height=H;
  if(o.mode==='dust'){
    ctx.fillStyle='#6B655B';ctx.fillRect(0,0,W,H);
    const g=ctx.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,H*.9);
    g.addColorStop(0,'rgba(90,86,78,.4)');g.addColorStop(1,'rgba(38,36,32,.95)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let i=0;i<W*H/38;i++){
      ctx.fillStyle=`rgba(${140+Math.random()*60},${132+Math.random()*55},${115+Math.random()*50},${.06+Math.random()*.3})`;
      ctx.fillRect(Math.random()*W,Math.random()*H,1.6,1.6);}
  }else{
    ctx.fillStyle='#7E1B12';ctx.fillRect(0,0,W,H);
    for(let i=0;i<W*H/26;i++){
      const r=Math.random();
      ctx.fillStyle=r<.5?`rgba(${120+Math.random()*40},18,12,${.15+Math.random()*.4})`:`rgba(${170+Math.random()*50},${40+Math.random()*20},22,${.1+Math.random()*.35})`;
      const s=1+Math.random()*3.2;ctx.fillRect(Math.random()*W,Math.random()*H,s,s);}
    const g=ctx.createRadialGradient(W/2,H/2,H*.12,W/2,H/2,H*.95);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(40,6,4,.85)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  const R=o.mode==='ink'?34:52;
  let drawing=false,lx=0,ly=0,strokes=0,done=false;
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];};
  const carve=(x,y)=>{
    ctx.globalCompositeOperation='destination-out';
    const g=ctx.createRadialGradient(x,y,R*.25,x,y,R);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';};
  const ratio=()=>{const d=ctx.getImageData(0,0,W,H).data;let c=0,n=0;
    for(let i=3;i<d.length;i+=4*97){n++;if(d[i]<40)c++;}return c/n;};
  const finish=()=>{if(done)return;done=true;
    cv.style.transition='opacity 1.1s';cv.style.opacity='0';el('dh2').style.display='none';
    setTimeout(()=>{cv.remove();o.onDone();},1150);};
  cv.addEventListener('pointerdown',e=>{drawing=true;[lx,ly]=pos(e);carve(lx,ly);el('dh2').style.opacity='.25';cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{
    if(!drawing||done)return;
    const[x,y]=pos(e);const dx=x-lx,dy=y-ly,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.floor(dist/(R*.4)));
    for(let i=1;i<=steps;i++)carve(lx+dx*i/steps,ly+dy*i/steps);
    lx=x;ly=y;
    if(++strokes%14===0&&ratio()>(o.threshold||.5))finish();});
  cv.addEventListener('pointerup',()=>{drawing=false;if(!done&&ratio()>(o.threshold||.5))finish();});
}

function go(id){setTap(null);stage.onclick=null;SC[id]();}
go('prologue');
</script>
