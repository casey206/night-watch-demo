<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夜巡 ・ 互動 Demo</title>
<style>
:root{
  --bg:#060709;--ink:#EDEAE3;--muted:#9A968E;--dim:#6A6660;
  --gold:#C9A227;--gold-l:#E8CE78;--gold-d:#7E661A;
  --line:rgba(201,162,39,.22);
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;
  --sans:"PingFang TC","Noto Sans TC",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);letter-spacing:.03em}

#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:default}

/* ─── 背景 ─── */
#bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;
    transition:opacity 1.5s ease;animation:kb 30s ease-out infinite alternate}
@keyframes kb{from{transform:scale(1.05)}to{transform:scale(1.16) translate3d(-1.5%,-1%,0)}}
#bg.on{opacity:.95}
#vig{position:absolute;inset:0;pointer-events:none;transition:opacity .9s;
  background:
    radial-gradient(62% 48% at 50% 52%,rgba(3,4,6,.86) 0%,rgba(3,4,6,.6) 44%,rgba(3,4,6,.12) 74%,transparent 88%),
    linear-gradient(180deg,rgba(3,4,6,.72) 0%,rgba(3,4,6,.1) 20%,transparent 40%),
    linear-gradient(0deg,rgba(3,4,6,.78) 0%,rgba(3,4,6,.12) 22%,transparent 42%),
    radial-gradient(130% 110% at 50% 50%,transparent 42%,rgba(3,4,6,.62) 100%)}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  animation:gr .6s steps(2) infinite}
@keyframes gr{0%{transform:translate(0,0)}50%{transform:translate(-3%,2%)}100%{transform:translate(2%,-3%)}}

/* ─── 第一人稱模式 ─── */
#pov{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s}
#pov.on{opacity:1}
#pov::before,#pov::after{content:"";position:absolute;left:0;right:0;height:9vh;background:#040507}
#pov::before{top:0}#pov::after{bottom:0}
body.pov #bg{animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{from{transform:scale(1.12) translate3d(-.7%,.3%,0)}to{transform:scale(1.15) translate3d(.7%,-.4%,0)}}
.povtag{position:absolute;left:50%;transform:translateX(-50%);top:calc(9vh + 18px);
  font-size:10px;letter-spacing:.45em;color:rgba(201,162,39,.55);z-index:30;opacity:0;transition:opacity 1s}
.povtag.on{opacity:1}

/* ─── HUD ─── */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:18px 26px;font-size:11px;letter-spacing:.26em;color:var(--dim);z-index:40;opacity:0;transition:opacity .8s}
#hud.on{opacity:1}
#hud b{color:var(--gold-l);font-weight:400;letter-spacing:.14em}
.clues{display:flex;gap:6px;align-items:center}
.cd{width:7px;height:7px;border:1px solid var(--gold-d);transform:rotate(45deg)}
.cd.f{background:var(--gold);box-shadow:0 0 9px rgba(201,162,39,.75)}

/* ─── 舞台 ─── */
.stage{position:relative;z-index:20;width:min(860px,92vw);max-height:86vh;overflow-y:auto;padding:16px 0;
  display:flex;flex-direction:column;align-items:center;text-align:center}
.stage::-webkit-scrollbar{width:0}
.spk{font-size:11px;letter-spacing:.42em;color:var(--gold);margin-bottom:20px;opacity:0;animation:fu .8s .1s forwards}
.ln{font-family:var(--serif);font-size:clamp(20px,2.9vw,29px);line-height:1.9;margin-bottom:10px;
  opacity:0;transform:translateY(9px);animation:fu .85s forwards;text-shadow:0 2px 26px rgba(0,0,0,.95)}
.ln.q{color:var(--gold-l);margin-top:14px}
.ln.sm{font-size:clamp(16px,2.1vw,20px);color:#BDB9B1}
@keyframes fu{to{opacity:1;transform:none}}
.tap{margin-top:24px;font-size:11px;letter-spacing:.3em;color:var(--dim);opacity:0;animation:bl 2.4s 1.1s infinite}
@keyframes bl{0%,100%{opacity:0}50%{opacity:.75}}

.opts{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:10px}
.opt{border:1px solid var(--line);background:rgba(10,11,14,.66);backdrop-filter:blur(9px);
  padding:16px 22px;font-size:16px;line-height:1.6;color:#DEDAD2;cursor:pointer;text-align:left;
  transition:.28s;opacity:0;transform:translateY(11px);animation:fu .6s forwards}
.opt:hover{border-color:var(--gold);background:rgba(201,162,39,.11);color:#fff;transform:translateX(5px)}
.opt .oi{color:var(--gold);font-family:var(--serif);margin-right:12px;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px;width:100%}
.chip{border:1px solid var(--line);padding:10px 18px;font-size:14px;cursor:pointer;transition:.22s;color:#CFCBC3;background:rgba(10,11,14,.6)}
.chip:hover{border-color:var(--gold)}
.chip.sel{background:var(--gold);color:#0A0B0D;border-color:var(--gold);font-weight:600}

.step{display:flex;align-items:center;gap:24px;margin-top:22px}
.sbtn{width:46px;height:46px;border:1px solid var(--line);background:transparent;color:var(--gold);
  font-size:24px;cursor:pointer;font-family:var(--serif);transition:.22s}
.sbtn:hover{border-color:var(--gold);background:rgba(201,162,39,.12)}
.snum{font-family:var(--serif);font-size:50px;color:var(--gold-l);min-width:76px}
.figs{display:flex;gap:10px;justify-content:center;margin-top:16px;min-height:52px;align-items:flex-end}
.fig{width:17px;height:42px;background:linear-gradient(180deg,var(--gold-l),var(--gold-d));
  border-radius:9px 9px 2px 2px;opacity:0;animation:fu .5s forwards;box-shadow:0 0 16px rgba(201,162,39,.45)}

.inp{background:transparent;border:0;border-bottom:1px solid var(--gold-d);color:var(--gold-l);
  font-family:var(--serif);font-size:34px;text-align:center;width:170px;padding:6px 0;outline:none;letter-spacing:.2em}
.inp::placeholder{color:rgba(201,162,39,.24)}
.inp.wide{width:min(520px,80vw);font-size:20px;letter-spacing:.06em}

.btn{margin-top:28px;border:1px solid var(--gold);background:transparent;color:var(--gold-l);
  padding:14px 44px;font-size:13px;letter-spacing:.4em;cursor:pointer;transition:.28s;font-family:var(--sans)}
.btn:hover{background:var(--gold);color:#0A0B0D}
.btn.ghost{border-color:var(--line);color:var(--muted);letter-spacing:.2em;padding:12px 28px;font-size:12px}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-l)}
.brow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* ─── 上傳 ─── */
.drop{width:min(420px,86vw);border:1px dashed var(--gold-d);background:rgba(10,11,14,.6);
  padding:38px 26px;cursor:pointer;transition:.3s;margin-top:8px}
.drop:hover{border-color:var(--gold);background:rgba(201,162,39,.07)}
.drop .ic{font-size:34px;color:var(--gold-d);margin-bottom:14px}
.drop .t{font-size:14px;color:var(--muted);line-height:1.9}
.pv{width:190px;height:190px;object-fit:cover;border:1px solid var(--gold);margin-top:8px;
  box-shadow:0 20px 60px rgba(0,0,0,.8);filter:grayscale(.18) contrast(1.05)}

/* ─── 委任狀 ─── */
.env{width:min(430px,84vw);aspect-ratio:1.62;background:linear-gradient(160deg,#1A1C21,#0D0E11);
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;cursor:pointer;transition:.5s;box-shadow:0 40px 90px rgba(0,0,0,.85)}
.env:hover{transform:translateY(-7px);border-color:var(--gold)}
.seal{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#C0392B,#7B1E14);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:#F3D9A0;font-size:24px;
  box-shadow:0 5px 20px rgba(0,0,0,.75),inset 0 -3px 9px rgba(0,0,0,.5)}
.warrant{width:min(560px,90vw);border:1px solid var(--line);background:linear-gradient(170deg,rgba(24,26,31,.94),rgba(10,11,14,.97));
  padding:40px 36px;text-align:center;box-shadow:0 40px 100px rgba(0,0,0,.9)}
.warrant .wt{font-family:var(--serif);font-size:15px;letter-spacing:.7em;color:var(--gold);margin-bottom:8px}
.warrant .wh{font-family:var(--serif);font-size:28px;letter-spacing:.35em;margin-bottom:26px}
.warrant .wl{font-family:var(--serif);font-size:16.5px;line-height:2.3;color:#D6D2CA}
.rules{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;
  line-height:2.1;color:var(--muted);text-align:left;letter-spacing:.08em}
.rules b{color:var(--gold);font-weight:400;margin-right:10px}

/* ─── 交接紀錄 ─── */
.rec{width:min(560px,90vw);border:1px solid var(--line);background:linear-gradient(170deg,rgba(24,26,31,.95),rgba(10,11,14,.97));
  padding:38px 34px;text-align:left;box-shadow:0 40px 100px rgba(0,0,0,.9)}
.rec .rt{font-family:var(--serif);font-size:12px;letter-spacing:.5em;color:var(--gold);text-align:center;margin-bottom:22px}
.rl{display:flex;padding:11px 0;border-bottom:1px solid rgba(201,162,39,.1);font-size:15px;align-items:baseline}
.rl:last-child{border:0}
.rl .a{flex:0 0 92px;font-size:11.5px;letter-spacing:.24em;color:var(--dim)}
.rl .b{flex:1;font-family:var(--serif);font-size:17px;color:var(--ink)}
.rl .b.gold{color:var(--gold-l)}

/* ─── 生成中 ─── */
.render{width:min(520px,88vw);text-align:center}
.bar{height:2px;background:rgba(201,162,39,.18);margin-top:26px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 12px var(--gold);transition:width .35s}
.rlog{margin-top:20px;font-size:12.5px;letter-spacing:.16em;color:var(--dim);min-height:2.4em;line-height:1.9}

/* ─── 影片 ─── */
.film{width:min(920px,94vw)}
.film video{width:100%;display:block;border:1px solid var(--line);background:#000;
  box-shadow:0 40px 120px rgba(0,0,0,.9)}
.filmcap{margin-top:16px;font-size:12px;letter-spacing:.26em;color:var(--gold);text-align:center}

/* ─── 結果分析 ─── */
.an{width:min(820px,94vw);text-align:left}
.antype{text-align:center;margin-bottom:34px}
.antype .k{font-size:11px;letter-spacing:.44em;color:var(--gold);margin-bottom:16px}
.antype .t{font-family:var(--serif);font-size:clamp(40px,7vw,68px);letter-spacing:.14em;line-height:1.15}
.antype .s{margin-top:14px;font-size:14px;color:var(--muted);letter-spacing:.1em}
.bars{margin:30px 0}
.brow2{display:flex;align-items:center;gap:16px;margin-bottom:13px}
.brow2 .bl{flex:0 0 66px;font-size:12px;letter-spacing:.18em;color:var(--muted)}
.brow2 .bt{flex:1;height:7px;background:rgba(201,162,39,.13);position:relative}
.brow2 .bt i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));
  transition:width 1.1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px rgba(201,162,39,.5)}
.brow2 .bv{flex:0 0 42px;text-align:right;font-family:var(--serif);font-size:17px;color:var(--gold-l)}
.reads{border-top:1px solid rgba(201,162,39,.16);padding-top:24px}
.read{display:flex;gap:16px;padding:13px 0;font-size:15px;line-height:1.85}
.read .rk{flex:0 0 82px;font-size:11px;letter-spacing:.2em;color:var(--gold);padding-top:5px}
.read .rv{flex:1;color:#D5D1C9}
.read .rv em{color:var(--gold-l);font-style:normal}
.cmp{margin-top:24px;padding:18px 22px;border:1px solid rgba(201,162,39,.2);background:rgba(201,162,39,.06);
  font-size:14px;color:#CFCBC3;line-height:1.9}
.cmp b{color:var(--gold-l);font-weight:600}

/* ─── 後台 ─── */
.bs{width:100%;text-align:left;background:rgba(6,7,9,.94);border:1px solid var(--line);padding:32px 30px;
    box-shadow:0 40px 100px rgba(0,0,0,.9)}
.bsh{display:flex;align-items:baseline;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.bsh .t{font-family:var(--serif);font-size:25px;letter-spacing:.08em}
.bsh .s{font-size:11px;letter-spacing:.3em;color:var(--gold)}
.bsub{font-size:13.5px;color:var(--muted);margin-bottom:24px;line-height:1.8}
.tbl{border:1px solid var(--line);margin-bottom:22px;overflow:hidden}
.trow{display:flex;border-bottom:1px solid rgba(201,162,39,.1);font-size:13.5px}
.trow:last-child{border:0}
.trow.h{background:rgba(201,162,39,.09);font-size:11px;letter-spacing:.2em;color:var(--gold)}
.trow>div{padding:11px 14px;line-height:1.7}
.c1{flex:0 0 112px;color:var(--dim);border-right:1px solid rgba(201,162,39,.1)}
.c2{flex:1.15;color:#D6D2CA;border-right:1px solid rgba(201,162,39,.1)}
.c3{flex:1;color:var(--gold-l);font-weight:600}
.brief{border:1px solid var(--gold-d);background:rgba(201,162,39,.07);padding:22px 24px;font-size:15px;line-height:2}
.brief .bh{font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:12px}
.brief em{color:var(--gold-l);font-style:normal}

/* ─── 轉場 ─── */
#flash{position:fixed;inset:0;background:#000;z-index:60;opacity:0;pointer-events:none;transition:opacity .55s}
#flash.on{opacity:1;pointer-events:all}
#chime{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;flex-direction:column;background:#040507}
#chime.on{display:flex}
#chime .ct{font-family:var(--serif);font-size:clamp(60px,15vw,150px);color:var(--gold);letter-spacing:.2em;
  text-shadow:0 0 70px rgba(201,162,39,.55)}
#chime .cs{font-size:11px;letter-spacing:.55em;color:var(--dim);margin-top:20px}
.pulse{animation:pl 1s ease-out}
@keyframes pl{0%{transform:scale(1);opacity:1}60%{transform:scale(1.1);opacity:.5}100%{transform:scale(1);opacity:1}}

.note{font-size:12.5px;color:var(--dim);line-height:1.9;margin-top:18px;max-width:56ch}
.skip{position:absolute;right:22px;bottom:18px;z-index:45;font-size:11px;letter-spacing:.26em;
  color:rgba(154,150,142,.5);cursor:pointer;transition:.3s}
.skip:hover{color:var(--gold-l)}

@media(max-width:640px){
  .stage{width:94vw}
  #hud{padding:12px 14px;font-size:10px;letter-spacing:.16em}
  .warrant,.rec,.bs{padding:26px 20px}
  .c1{flex:0 0 80px}.trow{font-size:12.5px}
  .read .rk{flex:0 0 66px}
}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div><div id="vig"></div><div id="grain"></div><div id="pov"></div>
  <div class="povtag" id="povtag">第 一 人 稱</div>
  <div id="hud">
    <div>寶城典藏館 ・ 第 <b>087</b> 任館長</div>
    <div id="clock"></div>
    <div class="clues" id="clues"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="skip" id="skip" style="display:none">略過序章 →</div>
</div>
<div id="chime"><div class="ct" id="chimeT">十二</div><div class="cs" id="chimeS">MIDNIGHT</div></div>
<div id="flash"></div>

<script>
/* ══════════════════════════════════════════
   夜巡 ・ 互動 Demo v2
   沈浸式序章 → 上傳 → 委任 → 六關（無出口）→ 影片 → 結果分析
   ══════════════════════════════════════════ */

const S={surname:'',photo:null,data:{},clues:0,min:0,motto:'',family:0,roles:[]};
const el=id=>document.getElementById(id);
const stage=el('stage'),bgEl=el('bg'),app=el('app');

function setTap(fn){app.onclick=fn;app.style.cursor=fn?'pointer':'default';}
function setBg(src){
  if(!src){bgEl.classList.remove('on');return;}
  bgEl.classList.remove('on');
  setTimeout(()=>{bgEl.style.backgroundImage=`url('${src}')`;bgEl.classList.add('on');},120);
}
function pov(on){
  document.body.classList.toggle('pov',on);
  el('pov').classList.toggle('on',on);
  el('povtag').classList.toggle('on',on);
}
function hud(on){el('hud').classList.toggle('on',on);paint();}
function paint(){
  const left=360-S.min;
  el('clock').innerHTML=left>0
    ?`天亮還有 <b>${Math.floor(left/60)}</b> 小時 <b>${String(left%60).padStart(2,'0')}</b> 分`
    :`<b>六點</b>`;
  el('clues').innerHTML='<span style="margin-right:8px">線索</span>'+
    Array.from({length:6},(_,i)=>`<span class="cd ${i<S.clues?'f':''}"></span>`).join('');
}
function fade(fn){el('flash').classList.add('on');setTimeout(()=>{fn();el('flash').classList.remove('on');},560);}
function chime(w,s,n,then){
  el('chimeT').textContent=w;el('chimeS').textContent=s;el('chime').classList.add('on');
  let i=0;const t=setInterval(()=>{
    el('chimeT').classList.remove('pulse');void el('chimeT').offsetWidth;el('chimeT').classList.add('pulse');
    if(++i>=n){clearInterval(t);setTimeout(()=>{el('chime').classList.remove('on');then();},900);}
  },520);
}

/* ── 對白播放 ── */
function play(o){
  if(o.bg!==undefined)setBg(o.bg);
  let i=0;const all=o.lines||[];
  const still='animation:none;opacity:1;transform:none';
  const draw=()=>{
    stage.innerHTML=(o.spk?`<div class="spk" style="${still}">${o.spk}</div>`:'')
      +all.slice(0,i+1).map((t,k)=>`<div class="ln ${o.sm?'sm':''}" style="${k<i?still:''}">${t}</div>`).join('')
      +(i<all.length-1?`<div class="tap">點擊繼續</div>`:'');
    stage.scrollTop=stage.scrollHeight;
  };
  const next=()=>{i<all.length-1?(i++,draw()):(setTap(null),o.render());};
  all.length?(setTap(next),draw()):(setTap(null),o.render());
}
function ask(o){
  play({bg:o.bg,spk:o.spk,lines:o.lines,render(){
    stage.innerHTML=(o.spk?`<div class="spk">${o.spk}</div>`:'')
      +(o.lines||[]).map(t=>`<div class="ln">${t}</div>`).join('')
      +`<div class="ln q">${o.q}</div>`
      +`<div class="opts">`+o.options.map((p,k)=>
        `<div class="opt" data-k="${k}" style="animation-delay:${.12+k*.09}s"><span class="oi">${'一二三四五'[k]}</span>${p.t}</div>`).join('')+`</div>`;
    stage.querySelectorAll('.opt').forEach(n=>n.onclick=e=>{
      e.stopPropagation();
      const p=o.options[+n.dataset.k];
      if(o.key)S.data[o.key]={a:p.t,field:p.field,val:p.val,score:p.score||{}};
      react(o,p);
    });
  }});
}
function react(o,p){
  S.min+=(o.adv||0);paint();
  const tail=[];
  if(p.r)tail.push(`<div class="ln">${p.r}</div>`);
  if(o.clue){S.clues++;paint();
    tail.push(`<div class="ln q" style="animation-delay:.5s">「${o.clue}」</div>`);
    tail.push(`<div class="spk" style="animation-delay:.9s;margin-top:18px">線索 ${S.clues} / 6</div>`);}
  stage.innerHTML=(o.spk?`<div class="spk">${o.spk}</div>`:'')+tail.join('')
    +`<div class="tap" style="animation-delay:1.3s">點擊繼續</div>`;
  setTap(()=>{setTap(null);fade(()=>go(o.next));});
}

const SC={};

/* ══ 0 ─ 序章（沈浸式冷開場，自動推進）══ */
SC.prologue=()=>{
  hud(false);pov(true);
  const BEATS=[
    {bg:'assets/01_door.jpg', l:['這座館收藏的，','是歷代成事的人留下的東西。']},
    {bg:'assets/06_warriors.jpg', l:['他們爭執了幾百年。','有些事，石頭斷不了。']},
    {bg:'assets/03_qianlong.jpg', l:['所以每隔一段時間，','館裡要請一位在世的人。']},
    {bg:'assets/02_vitrine.jpg', l:['當一夜的主人。','替他們裁決。']},
    {bg:'assets/08_cabbage.jpg', l:['今年——','<span style="color:var(--gold-l)">輪到你。</span>']}
  ];
  el('skip').style.display='block';
  el('skip').onclick=()=>{clearTimeout(timer);el('skip').style.display='none';pov(false);fade(()=>go('upload'));};
  let i=0,timer;
  const still='animation:none;opacity:1;transform:none';
  const beat=()=>{
    if(i>=BEATS.length){el('skip').style.display='none';pov(false);return fade(()=>go('upload'));}
    const b=BEATS[i];setBg(b.bg);
    stage.innerHTML=b.l.map((t,k)=>`<div class="ln" style="animation-delay:${.5+k*.9}s">${t}</div>`).join('');
    i++;timer=setTimeout(beat,i===BEATS.length?3600:4200);
  };
  beat();
};

      <button class="btn" id="n">查 看 結 果 分 析</button></div>
    <div class="note" style="text-align:center">
      正式版此處播放的是<b style="color:var(--gold-l)">以您上傳的照片生成的專屬影片</b>；<br>
      本 Demo 使用示範素材。</div>`;
  const v=el('v');
  v.play().catch(()=>{});
  el('sound').onclick=e=>{
    e.stopPropagation();
    v.muted=!v.muted;
    el('sound').textContent=v.muted?'點 此 開 啟 聲 音':'聲 音 已 開 啟';
    if(!v.paused)return; v.play().catch(()=>{});
  };
  // 讓觀眾先看完再給出口
  setTimeout(()=>{const b=el('nx');if(b){b.style.opacity='1';b.style.pointerEvents='auto';}},9000);
  el('n').onclick=()=>fade(()=>go('analysis'));
};

/* ══ 8 ─ 結果分析 ══ */
const DIMS=['決斷','傳承','風險','情感','遠見'];
function scores(){
  const s={決斷:0,傳承:0,風險:0,情感:0,遠見:0};
  Object.values(S.data).forEach(d=>{
    if(d.score)for(const k in d.score)s[k]=(s[k]||0)+d.score[k];
  });
  const max=Math.max(...DIMS.map(k=>s[k]),1);
  const pct={};DIMS.forEach(k=>pct[k]=Math.round(28+72*(s[k]/max)));
  return{raw:s,pct};
}
function curatorType(s){
  const top=DIMS.slice().sort((a,b)=>s.raw[b]-s.raw[a])[0];
  return({
    決斷:{t:'獨行的館長',s:'你自己扛。這座館交給你，最快。',
      d:'你習慣一個人拍板，也習慣一個人承擔後果。這讓你走得快，但也讓身邊的人不知道怎麼接手。'},
    傳承:{t:'留名的館長',s:'你在意的不是現在，是三百年後。',
      d:'你做的每個決定都在想「這件事會怎麼被記得」。這是難得的長線思維——但要小心，被記得的方式需要提前安排，不會自己發生。'},
    風險:{t:'扛下來的館長',s:'風險？那是我的事。',
      d:'你傾向把不確定留在自己身上，不假手他人。這是強者的直覺，但強者也會有撐不住的那一天，而那天通常不會提前通知。'},
    情感:{t:'守著人的館長',s:'東西是死的，人是活的。',
      d:'你的每個選擇背後都有一張臉。你護的不是館藏，是館藏後面的那些人——這是最溫暖、也最需要被具體安排的一種責任。'},
    遠見:{t:'布局的館長',s:'你早就想過今晚會發生什麼。',
      d:'你不急著決定，因為你已經算過了。這種人少見——但再好的布局，也需要定期回頭檢查缺口。'}
  })[top];
}
SC.analysis=()=>{
  setBg('assets/08_cabbage.jpg');
  const sc=scores(),ty=curatorType(sc);
  const g=k=>S.data[k]?S.data[k].val:'';
  const reads=[
    ['傳承',(g('loss')||'').includes('未啟動')?'你還沒開始安排。這一題有 <em>63%</em> 的館長跟你一樣——差別在於，他們大多在三年內就開始了。'
      :(g('loss')||'').includes('已規劃')?'你已經有安排。值得檢查的是：那份安排是幾年前做的？'
      :'你心裡已經有人選了。剩下的問題是他知不知道。'],
    ['接班',(g('succession')||'').includes('忠誠')?'你選擇讓老臣跟著走。這是義氣，也是成本。'
      :(g('succession')||'').includes('能力')?'你選擇留下能守的人。清醒，但要準備好承受那些沒被留下的目光。'
      :'你把決定交還給他們。這是尊重，也是還沒決定。'],
    ['風險',(g('risk')||'').includes('抗性高')?'你說你自己賠。八十六任館長裡，有 <em>四位</em> 真的賠了。'
      :(g('risk')||'').includes('互助')?'你選了最古老的那條——三千年前出海的人也是這樣分擔的。'
      :'你選擇提前把不確定交出去。這一夜你本來可以睡得比較好。'],
    ['身邊',`你說你身上有 <em>${S.family}</em> 隻蟲。白菜身上只有兩隻，它為了其中一隻走了一整夜。`]
  ];
  stage.innerHTML=`
    <div class="an">
      <div class="antype">
        <div class="k">第 087 任館長 ・ 裁決分析</div>
        <div class="t">${ty.t}</div>
        <div class="s">${ty.s}</div>
      </div>
      <div class="bars">
        ${DIMS.map(k=>`<div class="brow2"><div class="bl">${k}</div><div class="bt"><i data-w="${sc.pct[k]}"></i></div><div class="bv">${sc.pct[k]}</div></div>`).join('')}
      </div>
      <div class="reads">
        <div class="read"><div class="rk">總 評</div><div class="rv">${ty.d}</div></div>
        ${reads.map(([k,v])=>`<div class="read"><div class="rk">${k}</div><div class="rv">${v}</div></div>`).join('')}
      </div>
      <div class="cmp">
        你的附記：「<b>${S.motto}</b>」<br>
        這句話會刻在第 087 號展櫃的銘牌上，和前面八十六位館長並列。
      </div>
      <div class="brow" style="margin-top:30px;justify-content:flex-start">
        <button class="btn" id="n">交 接 紀 錄</button>
        <button class="btn ghost" id="b">顧問後台檢視 →</button>
      </div>
    </div>`;
  setTimeout(()=>stage.querySelectorAll('.bt i').forEach(n=>n.style.width=n.dataset.w+'%'),120);
  el('n').onclick=()=>fade(()=>go('record'));
  el('b').onclick=()=>fade(()=>go('backstage'));
};

/* ══ 9 ─ 交接紀錄 ＋ 交付 ══ */
SC.record=()=>{
  setBg('assets/08_cabbage.jpg');
  stage.innerHTML=`
    <div class="rec">
      <div class="rt">寶 城 典 藏 館 ・ 交 接 紀 錄</div>
      <div class="rl"><div class="a">任 期</div><div class="b">二〇二六年 ・ 一夜</div></div>
      <div class="rl"><div class="a">館 長</div><div class="b gold">第 087 任 ・ ${S.surname} 館長</div></div>
      <div class="rl"><div class="a">館 藏</div><div class="b gold">任內無失</div></div>
      <div class="rl"><div class="a">留 存</div><div class="b">${S.data.relic?S.data.relic.a:'—'}</div></div>
      <div class="rl"><div class="a">附 記</div><div class="b gold">「${S.motto}」</div></div>
    </div>
    <div class="ln q" style="font-size:19px;margin-top:28px">「紀錄冊需謄抄七日。留下地址。」</div>
    <div class="brow" style="margin-top:20px">
      <button class="btn" id="f">留 下 聯 絡 方 式</button>
      <button class="btn ghost" id="s">跳過，看後台</button></div>`;
  el('f').onclick=()=>{
    stage.innerHTML=`<div class="spk">實 體 交 付</div>
      <div class="ln q" style="font-size:20px">紀錄冊將由專屬顧問親送。</div>
      <input class="inp wide" placeholder="姓名" style="margin-top:24px">
      <input class="inp wide" placeholder="行動電話" style="margin-top:20px">
      <input class="inp wide" placeholder="送達地址" style="margin-top:20px">
      <button class="btn" id="d">送 出</button>
      <div class="note" style="text-align:center">Demo 不會送出任何資料。</div>`;
    el('d').onclick=()=>fade(()=>go('backstage'));};
  el('s').onclick=()=>fade(()=>go('backstage'));
};

/* ══ 10 ─ 顧問後台 ══ */
SC.backstage=()=>{
  setBg('');hud(false);
  const rows=Object.values(S.data).map(d=>
    `<div class="trow"><div class="c1">${d.field}</div><div class="c2">${d.a}</div><div class="c3">${d.val}</div></div>`).join('');
  const g=k=>S.data[k]?S.data[k].val:'';
  const anx=g('loss').includes('未啟動')?'傳承尚未啟動——最大切入空間'
    :g('succession').includes('迴避')?'接班尚未定案'
    :g('health').includes('迴避')?'健康議題迴避，需最後再談'
    :g('loss').includes('已規劃')?'已有既有架構，找缺口而非重做':'傳承與接班';
  const open=(g('adversity')||'').includes('家庭')?'從家人切入，先聊他提到的那鍋湯'
    :(g('adversity')||'').includes('孤獨')?'避開家庭話題，從他一個人撐過的那段切入'
    :(g('adversity')||'').includes('壓抑')?'不要急，這位需要兩到三次見面才會開口'
    :'從事業成就切入，他習慣用結果溝通';
  const prod=(g('loss')||'').includes('血緣')?'高保額壽險 ＋ 教育金信託'
    :(g('loss')||'').includes('能力')?'股權信託 ＋ 家族憲章'
    :(g('loss')||'').includes('已規劃')?'既有架構健檢，找稅務與流動性缺口'
    :'從最基本的保障缺口開始，不要一次講架構';
  const resist=(g('risk')||'').includes('抗性高')?'高——第一次見面完全不要提商品'
    :(g('risk')||'').includes('互助')?'中——可從共同分攤概念自然帶入':'低——可較早進入規劃討論';
  stage.innerHTML=`
    <div class="bs">
      <div class="bsh"><span class="s">顧 問 後 台</span><span class="t">${S.surname}　客戶檔案</span>
        <span style="font-size:12px;color:var(--dim);margin-left:auto">第 087 號 ・ 一夜完成</span></div>
      <div class="bsub">同一份體驗，客戶看到的是故事與結果分析；顧問看到的是這一頁。<br>
        <b style="color:var(--gold-l)">客戶從頭到尾沒有填過一張表格。</b></div>
      <div class="tbl">
        <div class="trow h"><div class="c1">欄位</div><div class="c2">他在遊戲裡的回答</div><div class="c3">系統判讀</div></div>
        ${rows}
        <div class="trow"><div class="c1">人生信條</div><div class="c2">「${S.motto}」</div><div class="c3">親筆附記 ・ 破冰最強素材</div></div>
        <div class="trow"><div class="c1">影像</div><div class="c2">${S.photo?'已上傳本人照片':'未上傳'}</div><div class="c3">${S.photo?'可生成專屬交接影片':'以預設形象產出'}</div></div>
      </div>
      <div class="brief">
        <div class="bh">系 統 建 議 ・ 首 次 接 觸</div>
        推銷抗性：<em>${resist}</em><br>
        開場建議：<em>${open}</em>。<br>
        優先議題：<em>${anx}</em>；受益／受扶養對象 <em>${S.family} 人</em>。<br>
        商品方向：<em>${prod}</em>。<br>
        可用破冰句：他親手寫下「<em>${S.motto}</em>」——見面時從這句開始。
      </div>
      <div class="note" style="margin-top:24px">
        後台<b style="color:var(--gold-l)">不丟原始欄位給業務員，只丟「怎麼開口」</b>。<br>
        這一條決定顧問會不會用第二次——也是多數保險數位活動失敗的真正原因。</div>
      <div class="brow" style="margin-top:30px;justify-content:flex-start">
        <button class="btn" id="r">重 新 體 驗</button></div>
    </div>`;
  el('r').onclick=()=>{
    S.data={};S.clues=0;S.min=0;S.motto='';S.family=0;S.roles=[];S.photo=null;
    fade(()=>go('prologue'));};
};

function go(id){setTap(null);stage.onclick=null;SC[id]();}
go('prologue');
</script>
